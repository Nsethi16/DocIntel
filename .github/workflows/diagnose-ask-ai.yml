name: Diagnose Ask AI

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: Application workspace for saved diagnostics or synthetic acceptance checks.
        type: string
        default: contoso-legal
      run_id:
        description: Run/document ID. CustomerAcceptance requires the exact 32-hex completed A upload ID. Inspect also accepts recent; Document also accepts SHA-256 of its exact UTF-8 filename.
        type: string
        required: false
      mode:
        description: Choose saved diagnostics, synthetic checks, or explicit operator-only CustomerAcceptance over uploaded QA documents.
        type: choice
        options: [Inspect, Data, Replay, Contract, Synthetic, Document, TranslationProbe, DocumentReprocess, ProcessingSynthetic, TranslationSynthetic, CustomerAcceptance, EmailPreview, DealVelocityApply, DealVelocityInspect, CommercialApply, CommercialInspect, CommercialQuestion]
        default: Inspect
      customer_case:
        description: CustomerAcceptance only. One bounded case per dispatch. submit-documents queues fixed embedded B-G PDFs through the backend, not the browser; documents is read-only.
        type: choice
        options: [documents, submit-documents, ask-termination, ask-analysis, ask-followup, ask-no-evidence, ask-injection, ask-long-tail, schema-signature, schema-price, schema-long, commercial-values, commercial-billing, commercial-terms, commercial-risk]
        default: documents
      confirmation:
        description: PORTFOLIO authorizes commercial processing definitions, clean filenames and multilingual PDF submission; ASK saves a fixed commercial web answer. DEALVELOCITY, TEST, REPLAY, PREVIEW, PROBE and REPROCESS retain their scoped meanings. Provider usage can incur charges.
        type: string
        default: ''
      translation_variant:
        description: TranslationProbe only. WithoutGlossary is an explicit discarded comparison, never a setting change.
        type: choice
        options: [Configured, WithoutGlossary]
        default: Configured

permissions:
  contents: read

concurrency:
  group: docintel-azure-${{ vars.AZURE_RESOURCE_GROUP || 'Docintel' }}-${{ vars.AZURE_CONTAINER_APP_NAME || 'ca-docintel-dev' }}
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: docintel-dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'Docintel' }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'ca-docintel-dev' }}
      DOCINTEL_CONTAINER_NAME: ${{ vars.DOCINTEL_CONTAINER_NAME }}
      DIAGNOSTIC_TENANT: ${{ inputs.tenant_id }}
      DIAGNOSTIC_RUN: ${{ inputs.run_id }}
      DIAGNOSTIC_MODE: ${{ inputs.mode }}
      DIAGNOSTIC_CUSTOMER_CASE: ${{ inputs.customer_case }}
      TRANSLATION_VARIANT: ${{ inputs.translation_variant }}
    steps:
      - name: Validate explicit diagnostic input and Azure identity consistency
        shell: pwsh
        env:
          DIAGNOSTIC_CONFIRMATION: ${{ inputs.confirmation }}
          PERSONAL_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PERSONAL_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          PERSONAL_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if ($env:DIAGNOSTIC_MODE -eq 'Replay' -and $env:DIAGNOSTIC_CONFIRMATION -cne 'REPLAY') {
            throw 'Replay requires the exact confirmation REPLAY.'
          }
          if ($env:DIAGNOSTIC_MODE -eq 'EmailPreview' -and
              ($env:DIAGNOSTIC_CONFIRMATION -cne 'PREVIEW' -or
               $env:DIAGNOSTIC_RUN -cnotmatch '^mail-[A-Fa-f0-9]{64}$')) {
            throw 'EmailPreview requires PREVIEW and one opaque email run ID; it never sends or saves a run.'
          }
          if ($env:DIAGNOSTIC_MODE -eq 'DealVelocityApply' -and $env:DIAGNOSTIC_CONFIRMATION -cne 'DEALVELOCITY') {
            throw 'DealVelocityApply requires DEALVELOCITY; it renames only the existing workspace and submits fixed fictional PDFs.'
          }
          if ($env:DIAGNOSTIC_MODE -eq 'CommercialApply' -and $env:DIAGNOSTIC_CONFIRMATION -cne 'PORTFOLIO') {
            throw 'CommercialApply requires PORTFOLIO; current access, channel, identity and model choices are preserved.'
          }
          if ($env:DIAGNOSTIC_MODE -eq 'CommercialQuestion' -and
              ($env:DIAGNOSTIC_CONFIRMATION -cne 'ASK' -or
               $env:DIAGNOSTIC_CUSTOMER_CASE -cnotin @('commercial-values', 'commercial-billing', 'commercial-terms', 'commercial-risk'))) {
            throw 'CommercialQuestion requires ASK and one fixed source-scoped commercial question; no email is sent.'
          }
          if ($env:DIAGNOSTIC_MODE -eq 'TranslationProbe' -and $env:DIAGNOSTIC_CONFIRMATION -cne 'PROBE') {
            throw 'TranslationProbe requires the exact confirmation PROBE.'
          }
          if ($env:DIAGNOSTIC_MODE -eq 'DocumentReprocess' -and $env:DIAGNOSTIC_CONFIRMATION -cne 'REPROCESS') {
            throw 'DocumentReprocess requires the exact confirmation REPROCESS.'
          }
          if ($env:DIAGNOSTIC_MODE -eq 'CustomerAcceptance' -and
              ($env:DIAGNOSTIC_CONFIRMATION -cne 'TEST' -or $env:DIAGNOSTIC_TENANT -cne 'contoso-legal' -or
               $env:DIAGNOSTIC_CUSTOMER_CASE -cnotin @('documents', 'submit-documents', 'ask-termination',
                 'ask-analysis', 'ask-followup', 'ask-no-evidence', 'ask-injection', 'ask-long-tail',
                 'schema-signature', 'schema-price', 'schema-long'))) {
            throw 'CustomerAcceptance requires TEST, contoso-legal, and one supported customer case.'
          }
          if ($env:TRANSLATION_VARIANT -and $env:TRANSLATION_VARIANT -notin @('Configured', 'WithoutGlossary') -or
            $env:TRANSLATION_VARIANT -eq 'WithoutGlossary' -and $env:DIAGNOSTIC_MODE -ne 'TranslationProbe') {
            throw 'A glossary comparison requires an explicit TranslationProbe.'
          }
          if ($env:DIAGNOSTIC_MODE -notin @('Inspect', 'Data', 'Replay', 'Contract', 'Synthetic', 'Document', 'TranslationProbe', 'DocumentReprocess', 'ProcessingSynthetic', 'TranslationSynthetic', 'CustomerAcceptance', 'EmailPreview', 'DealVelocityApply', 'DealVelocityInspect', 'CommercialApply', 'CommercialInspect', 'CommercialQuestion')) { throw 'Invalid diagnostic mode.' }
          if ($env:DIAGNOSTIC_TENANT -notmatch '^[a-z0-9][a-z0-9-]{0,127}$' -or
            ($env:DIAGNOSTIC_MODE -notin @('Contract', 'Synthetic', 'ProcessingSynthetic', 'TranslationSynthetic') -and
             $env:DIAGNOSTIC_RUN -notmatch '^[a-fA-F0-9]{32}$' -and
             -not ($env:DIAGNOSTIC_MODE -eq 'EmailPreview' -and $env:DIAGNOSTIC_RUN -cmatch '^mail-[A-Fa-f0-9]{64}$') -and
             -not ($env:DIAGNOSTIC_MODE -in @('DealVelocityApply', 'DealVelocityInspect', 'CommercialApply', 'CommercialInspect', 'CommercialQuestion') -and
                   $env:DIAGNOSTIC_TENANT -ceq 'contoso-legal' -and $env:DIAGNOSTIC_RUN -cmatch '^mail-[A-Fa-f0-9]{64}$') -and
             -not ($env:DIAGNOSTIC_MODE -eq 'Document' -and $env:DIAGNOSTIC_RUN -match '^[a-fA-F0-9]{64}$') -and
             -not ($env:DIAGNOSTIC_MODE -eq 'Inspect' -and $env:DIAGNOSTIC_RUN -ceq 'recent'))) {
            throw 'Invalid tenant/run identifiers.'
          }
          if ($env:DIAGNOSTIC_MODE -in @('Contract', 'Synthetic', 'ProcessingSynthetic', 'TranslationSynthetic') -and $env:DIAGNOSTIC_RUN) {
            throw 'Contract checks do not accept saved run identifiers.'
          }
          $values = @($env:PERSONAL_CLIENT_ID, $env:PERSONAL_TENANT_ID, $env:PERSONAL_SUBSCRIPTION_ID)
          $present = @($values | Where-Object { -not [String]::IsNullOrWhiteSpace($_) }).Count
          if ($present -ne 0 -and $present -ne 3) { throw 'Configure all three AZURE identity secrets together.' }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.CADOCINTELDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.CADOCINTELDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.CADOCINTELDEV_AZURE_SUBSCRIPTION_ID }}
      - name: Run the bounded operator diagnostic in the active app identity
        shell: python
        run: |
          import json
          import os
          import re
          import shlex
          import subprocess
          import sys

          def customer_record(value):
              counts = {"pages", "slices", "translatedSlices", "sourceCharacters", "structuredDocuments",
                        "tableRows", "promptResults", "searches", "inspections", "citations", "analyses",
                        "layoutPages", "layoutWords", "ocrPages", "embeddedTextPages",
                        "configuredRules", "configuredProfiles", "recognizedSlices", "entities"}
              allowed = counts | {"phase", "customerCase", "scenario", "status", "failureCode", "jobId",
                                  "runId", "reused", "jobStatus", "sourceSha256", "layoutSha256",
                                  "hasWarnings", "assertions", "sources", "origin", "coverage",
                                  "failureType", "failureSite"}
              codes = {
                  "None", "InvalidInput", "LiveProbingDisabled", "BasisNotEligible", "FixtureUnavailable",
                  "FixtureDiscoveryLimit", "OriginalUnavailable", "SourceIntegrityFailed", "WorkspaceUnavailable",
                  "WorkspaceChanged", "SourceChanged", "PrerequisiteUnavailable", "RunConflict", "ExistingRunPending",
                  "AcceptanceMismatch", "ArtifactCheckFailed", "DiagnosticFailed", "TimedOut", "AccessRevoked",
                  "ProcessingNotCompleted",
                  "SubmissionUnavailable", "EmbeddedFixtureUnavailable", "EmbeddedFixtureInvalid", "SubmissionConflict",
                  "Interrupted", "InvalidModelAnswer", "UnknownCitation", "MissingEvidence", "CitationMismatch",
                  "ToolCallLimit", "EvidenceLimit", "InvalidToolArguments", "RetrievalFailed", "ResponseTokenLimit",
                  "DataQueryRejected", "DataAccessDenied", "DataRateLimited", "DataUnavailable", "DataRequestFailed",
                  "ProviderContextLimit", "ProviderQuotaExceeded", "ProviderRateLimited", "ProviderSchemaRejected",
                  "ProviderAccessDenied", "ProviderDeploymentUnavailable", "ProviderTimedOut", "ProviderUnavailable",
                  "ProviderContentFiltered", "ProviderRequestRejected", "ExecutionFailed",
                  "UnrequestedHeaderTables", "UnrequestedTableOutput", "IncompleteExtractionBatches",
                  "InvalidStructuredResponse"
              }
              assertion_ids = {
                  "UniqueUploadedFixture", "OriginalIntegrity", "PageCount", "SliceBoundaries", "PerSliceLanguage",
                  "SourceGroundTruth", "PdfArtifactsAndTranslation", "SourceLayoutWords",
                  "GenuineContentUnderstandingOcr", "FinalPageTermination", "LongSourceTail", "ExpectedWarnings",
                  "ConfiguredStructuredExtraction", "ConfiguredClassification", "RemainingInsights",
                  "RemainingPromptOutputs", "MachineExportNoReview", "MachineExportJson", "MachineExportCsv",
                  "MachineExportXlsx", "RunCompleted", "NoExternalDelivery", "SourceScopeIsolation",
                  "CurrentSourceVersions", "OriginalCitations", "PromptInjectionRejected", "ServiceAgreementFacts",
                  "SixtyDayTermination", "TerminationSourceCitation", "ServerCalculatedSignedTotals",
                  "MissingIsNotZero", "FourSheetCitations", "VerifiedFollowup", "EurOnlyFollowup",
                  "NoMatchSearch", "NoFabricatedAnswer", "FinalSourceCitation", "AnalysisCitations",
                  "EmbeddedPdfValidated", "SubmissionIdempotency", "UploadedJobCompleted",
                  "SchemaClassification", "SchemaFields", "SchemaRows", "SchemaMissingAmount",
                  "SchemaNativeDecision", "SchemaNoSimulation", "SchemaSourceUnchanged",
                  "SchemaFieldShape", "SchemaCustomer", "SchemaCustomerFormatting",
                  "SchemaQuoteIds", "SchemaQuoteFormatting", "SchemaCurrencies", "SchemaAmounts"
              }
              if (not isinstance(value, dict) or set(value) - allowed or
                  value.get("phase") != "CustomerAcceptance" or
                  value.get("customerCase") != os.environ["DIAGNOSTIC_CUSTOMER_CASE"] or
                  value.get("scenario") not in {"A", "B", "C", "D", "E", "F", "G", "Summary"} or
                  value.get("status") not in {"Completed", "Failed", "Refused", "Pending", "Submitted", "Reused"} or
                  value.get("failureCode") not in codes):
                  raise RuntimeError("The customer diagnostic returned an invalid metadata record.")
              if (value.get("origin") not in {None, "OperatorCli"} or
                  value.get("coverage") not in {
                      None, "BackendSubmission", "StoredDocumentAndExportHelpers", "AskAiProcessor",
                      "LiveModelControlledCatalog"}):
                  raise RuntimeError("The customer diagnostic returned an invalid coverage category.")
              if (value.get("failureType") not in {
                      None, "ArgumentException", "InvalidOperationException", "InvalidDataException", "JsonException",
                      "FormatException", "RequestFailedException", "ClientResultException", "AuthenticationFailedException",
                      "CosmosException", "InvalidCastException", "NullReferenceException", "OtherException"} or
                  value.get("failureSite") not in {
                      None, "DataExtraction", "Identification", "ModelConfiguration", "Workflow", "ControlledDiagnostic"}):
                  raise RuntimeError("The customer diagnostic returned invalid failure metadata.")
              for key in counts:
                  item = value.get(key)
                  if item is not None and (type(item) is not int or not 0 <= item <= 1_000_000_000):
                      raise RuntimeError("The customer diagnostic returned an invalid count.")
              for key, pattern in (("jobId", r"[a-fA-F0-9]{32}"), ("runId", r"[a-fA-F0-9]{64}"),
                                   ("sourceSha256", r"[a-fA-F0-9]{64}"), ("layoutSha256", r"[a-fA-F0-9]{64}")):
                  item = value.get(key)
                  if item is not None and (not isinstance(item, str) or not re.fullmatch(pattern, item)):
                      raise RuntimeError("The customer diagnostic returned an invalid opaque reference.")
              for key in ("reused", "hasWarnings"):
                  if value.get(key) is not None and type(value[key]) is not bool:
                      raise RuntimeError("The customer diagnostic returned an invalid flag.")
              if value.get("jobStatus") not in {None, "Queued", "Running", "Completed", "Failed"}:
                  raise RuntimeError("The customer diagnostic returned an invalid document state.")
              assertions = value.get("assertions")
              if (not isinstance(assertions, list) or len(assertions) > 48 or any(
                      not isinstance(item, dict) or set(item) != {"id", "status"} or
                      item["id"] not in assertion_ids or item["status"] not in {"Passed", "Failed", "NotApplicable"}
                      for item in assertions)):
                  raise RuntimeError("The customer diagnostic returned invalid assertion metadata.")
              sources = value.get("sources")
              if sources is not None and (not isinstance(sources, list) or len(sources) > 7 or any(
                      not isinstance(item, dict) or set(item) != {"jobId", "sourceSha256"} or
                      not isinstance(item["jobId"], str) or not re.fullmatch(r"[a-fA-F0-9]{32}", item["jobId"]) or
                      not isinstance(item["sourceSha256"], str) or
                      not re.fullmatch(r"[a-fA-F0-9]{64}", item["sourceSha256"]) for item in sources)):
                  raise RuntimeError("The customer diagnostic returned invalid source references.")
              return value

          def inspect(arguments):
              result = subprocess.run(
                  ["az", *arguments, "--only-show-errors", "--output", "json"],
                  capture_output=True, text=True, timeout=45)
              if result.returncode:
                  raise RuntimeError("Azure target inspection failed; no runtime diagnostic was executed.")
              return json.loads(result.stdout)

          target = ["--resource-group", os.environ["AZURE_RESOURCE_GROUP"],
                    "--name", os.environ["AZURE_CONTAINER_APP_NAME"]]
          app = inspect(["containerapp", "show", *target])
          revision = app["properties"]["latestRevisionName"]
          containers = app["properties"]["template"]["containers"]
          configured = os.environ.get("DOCINTEL_CONTAINER_NAME")
          selected = [item for item in containers if not configured or item["name"] == configured]
          if len(selected) != 1:
              raise RuntimeError("Select exactly one DocIntel container.")
          replicas = inspect(["containerapp", "replica", "list", *target, "--revision", revision])
          if not replicas:
              raise RuntimeError("The current revision has no active replica.")
          replay = "true" if os.environ["DIAGNOSTIC_MODE"] == "Replay" else "false"
          if os.environ["DIAGNOSTIC_MODE"] == "CommercialQuestion":
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll", "--commercial-question", os.environ["DIAGNOSTIC_RUN"],
                  "--commercial-scenario", os.environ["DIAGNOSTIC_CUSTOMER_CASE"],
                  "--diagnose-confirmation", "ASK", "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"]])
          elif os.environ["DIAGNOSTIC_MODE"] in ("DealVelocityApply", "DealVelocityInspect", "CommercialApply", "CommercialInspect"):
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll", "--manage-deal-velocity", os.environ["DIAGNOSTIC_RUN"],
                  "--deal-velocity-action", "Apply" if os.environ["DIAGNOSTIC_MODE"] in ("DealVelocityApply", "CommercialApply") else "Inspect",
                  "--commercial-portfolio", "true" if os.environ["DIAGNOSTIC_MODE"].startswith("Commercial") else "false",
                  "--diagnose-confirmation", "PORTFOLIO" if os.environ["DIAGNOSTIC_MODE"].startswith("Commercial") else "DEALVELOCITY",
                  "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"]])
          elif os.environ["DIAGNOSTIC_MODE"] == "EmailPreview":
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll",
                  "--diagnose-email-preview", os.environ["DIAGNOSTIC_RUN"],
                  "--diagnose-confirmation", "PREVIEW",
                  "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"]])
          elif os.environ["DIAGNOSTIC_MODE"] == "CustomerAcceptance":
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll",
                  "--diagnose-customer-acceptance", os.environ["DIAGNOSTIC_RUN"],
                  "--diagnose-customer-case", os.environ["DIAGNOSTIC_CUSTOMER_CASE"],
                  "--diagnose-customer-live", "true", "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"]])
          elif os.environ["DIAGNOSTIC_MODE"] == "DocumentReprocess":
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll", "--reprocess-document", os.environ["DIAGNOSTIC_RUN"],
                  "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"]])
          elif os.environ["DIAGNOSTIC_MODE"] in ("ProcessingSynthetic", "TranslationSynthetic"):
              flag = "--diagnose-processing-synthetic" if os.environ["DIAGNOSTIC_MODE"] == "ProcessingSynthetic" else "--diagnose-translation-synthetic"
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll", flag, "true",
                  "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"]])
          elif os.environ["DIAGNOSTIC_MODE"] in ("Document", "TranslationProbe"):
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll", "--diagnose-document", os.environ["DIAGNOSTIC_RUN"],
                  "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"],
                  "--diagnose-translation-probe", "true" if os.environ["DIAGNOSTIC_MODE"] == "TranslationProbe" else "false",
                  "--diagnose-translation-variant", os.environ.get("TRANSLATION_VARIANT") or "Configured"])
          elif os.environ["DIAGNOSTIC_MODE"] == "Data":
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll", "--diagnose-ask-data", os.environ["DIAGNOSTIC_RUN"],
                  "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"]])
          elif os.environ["DIAGNOSTIC_MODE"] == "Synthetic":
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll", "--diagnose-ask-synthetic", "true",
                  "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"]])
          elif os.environ["DIAGNOSTIC_MODE"] == "Contract":
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll", "--diagnose-ask-contract", "true",
                  "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"]])
          else:
              diagnostic = shlex.join([
                  "dotnet", "/app/DocIntel.Api.dll",
                  "--diagnose-ask-run", os.environ["DIAGNOSTIC_RUN"],
                  "--diagnose-tenant", os.environ["DIAGNOSTIC_TENANT"],
                  "--diagnose-replay", replay])
          command = ["az", "containerapp", "exec", *target, "--revision", revision,
                     "--replica", replicas[0]["name"], "--container", selected[0]["name"],
                     "--command", diagnostic, "--only-show-errors"]
          result = subprocess.run(
              ["script", "-q", "-e", "-c", shlex.join(command), "/dev/null"],
              capture_output=True, text=True, timeout=420,
              env={**os.environ, "TERM": "dumb"})
          records = []
          for line in result.stdout.splitlines():
              line = re.sub(r"\x1b\[[0-9;?]*[A-Za-z]", "", line)
              marker = line.find("DOCINTEL_DIAGNOSTIC ")
              if marker < 0:
                  continue
              value = json.loads(line[marker + len("DOCINTEL_DIAGNOSTIC "):])
              if os.environ["DIAGNOSTIC_MODE"] == "CommercialQuestion":
                  if (value.get("phase") != "CommercialQuestion" or
                      value.get("scenario") != os.environ["DIAGNOSTIC_CUSTOMER_CASE"]):
                      raise RuntimeError("Invalid commercial question metadata.")
                  safe = {key: value[key] for key in (
                      "phase", "scenario", "status", "failureCode", "runId", "citations", "analyses", "hasBarChart") if key in value}
                  print(json.dumps(safe))
                  records.append(safe)
                  continue
              if os.environ["DIAGNOSTIC_MODE"] in ("DealVelocityApply", "DealVelocityInspect", "CommercialApply", "CommercialInspect"):
                  allowed_files = {
                      "DV-Demo-DV-Q-2026-1041-Arbor-Ridge-Manufacturing.pdf",
                      "DV-Demo-DV-Q-2026-1042-Arbor-Ridge-Manufacturing.pdf",
                      "DV-Demo-DV-Q-2026-2081-Summit-Harbor-Logistics.pdf",
                      "DV-Demo-DV-Q-2026-3051-Redwood-Lane-Retail.pdf",
                      "DV-Demo-DV-Q-2026-4101-Crescent-Vale-Health-Services.pdf",
                      "DV-Demo-Q1041-Arbor-Ridge-Copy.pdf", "DV-Demo-Q2082-Summit-Harbor-Draft.pdf",
                      "DV-Demo-Arbor-Ridge-Master-Services-Agreement.pdf",
                      "DV-Demo-Summit-Harbor-Deposit-Invoice.pdf",
                      "Arbor-Ridge-Analytics-Commercial-Offer-DVX-Q-2026-1101.pdf",
                      "Arbor-Ridge-Master-Services-Agreement-DVX-MSA-2026-1101.pdf",
                      "Arbor-Ridge-Implementation-Statement-of-Work-DVX-SOW-2026-1101.pdf",
                      "Arbor-Ridge-Purchase-Order-DVX-PO-2026-1101.pdf",
                      "Arbor-Ridge-Mobilization-Invoice-DVX-INV-2026-1101.pdf",
                      "Arbor-Ridge-Supplier-Risk-Amendment-DVX-AM-2026-1101.pdf",
                      "Summit-Harbor-Propuesta-de-Automatizacion-DVX-Q-2026-1201.pdf",
                      "Summit-Harbor-Extension-Scope-DVX-Q-2026-1202.pdf",
                      "Crescent-Vale-Offre-de-Services-DVX-Q-2026-1301.pdf",
                      "Crescent-Vale-Accord-Traitement-Donnees-DVX-DPA-2026-1301.pdf",
                      "Redwood-Lane-Handelsangebot-DVX-Q-2026-1401.pdf",
                      "Arbor-Ridge-Commercial-Agreement-Packet-DVX-COM-2026-1101.pdf",
                      "Arbor-Ridge-Commercial-Offer-DVX-Q-2026-1101-Procurement-Copy.pdf",
                      "Arbor-Ridge-Mobilization-Invoice-DVX-INV-2026-1101-Scanned.pdf"}
                  if (value.get("phase") != "DealVelocity" or
                      value.get("fileName") not in allowed_files | {None} or
                      value.get("workspaceName") not in {None, "Other", "Deal Velocity"} or
                      value.get("status") not in {"Renamed", "NotRenamed", "Queued", "Running", "Completed",
                        "Failed", "Pending", "Submitted", "NotFound", "Refused"} or
                      value.get("failureCode") not in {"None", "InvalidSetupInput", "ProcessingFailed",
                        "CurrentAdministratorRequired", "WorkspaceChanged", "DocumentConflictOrIntegrityFailed",
                        "TimedOut", "SetupFailed", "TranslationNotCompleted", "DocumentChanged",
                        "PortfolioFeaturesIncomplete", "PacketSplitIncomplete", "OcrNotVerified"}):
                      raise RuntimeError("Invalid fixed demonstration setup metadata.")
                  safe = {key: value[key] for key in (
                      "phase", "stage", "status", "failureCode", "workspaceName", "version", "fileName",
                      "jobId", "pages", "slices", "sourceCharacters", "hasWarnings", "translatedSlices", "languages",
                      "promptResults", "insightCount", "evaluatedPromptResults", "verifiedOcrPages",
                      "recognizedSlices", "structuredDocuments",
                      "entities", "failedStages") if key in value}
                  print(json.dumps(safe))
                  records.append(safe)
                  continue
              safe = customer_record(value) if os.environ["DIAGNOSTIC_MODE"] == "CustomerAcceptance" else {
                  key: value[key] for key in (
                  "phase", "status", "failureCode", "searches", "inspections",
                  "matchedDocuments", "citations", "httpStatus", "providerCode",
                  "providerParameter", "schemaKeyword", "providerHints",
                  "variant", "model", "modelProvider", "calls", "analyses", "runId", "createdAtUtc",
                  "completedAtUtc", "lastStep", "analyticalAttempts", "matches", "subStatus",
                  "hasBarChart", "jobId", "pages", "slices", "identifiedSlices", "translatedSlices",
                  "stage", "sliceIndex", "decisionCompleted", "hasWarnings", "insightCount", "entityCount",
                  "structuredDocuments", "promptResults", "detectedLanguages", "failedStages",
                  "languageChecks", "probeTranslated") if key in value}
              print(json.dumps(safe))
              records.append(safe)
          if not records:
              raise RuntimeError("The runtime diagnostic returned no verified result. Raw process output was not published.")
          expected_phase = "CommercialQuestion" if os.environ["DIAGNOSTIC_MODE"] == "CommercialQuestion" else "DealVelocity" if os.environ["DIAGNOSTIC_MODE"] in ("DealVelocityApply", "DealVelocityInspect", "CommercialApply", "CommercialInspect") else os.environ["DIAGNOSTIC_MODE"] if os.environ["DIAGNOSTIC_MODE"] in ("Data", "Contract", "Synthetic", "Document", "TranslationProbe", "DocumentReprocess", "ProcessingSynthetic", "TranslationSynthetic", "CustomerAcceptance", "EmailPreview") else (
              "Replay" if replay == "true" else "Stored")
          if records[-1].get("phase") != expected_phase:
              raise RuntimeError("The requested diagnostic did not complete.")
          if records[-1].get("status") in ("Refused", "NotFound", "Pending") or (
                  expected_phase in ("Data", "Replay", "Contract", "Synthetic", "DocumentReprocess", "ProcessingSynthetic", "TranslationSynthetic", "CustomerAcceptance", "EmailPreview", "DealVelocity", "CommercialQuestion") and records[-1].get("status") == "Failed"):
              sys.exit(1)
          if expected_phase == "CustomerAcceptance" and (
                  result.returncode or records[-1].get("scenario") != "Summary" or
                  records[-1].get("status") != "Completed"):
              sys.exit(1)
