name: Validate and deploy DocIntel

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'infra/**'
      - 'scripts/**'
      - 'Directory.*.props'
      - 'DocIntel.slnx'
      - 'NuGet.config'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Deploy-DocIntelAzure.ps1'
      - '.github/workflows/ca-docintel-dev-AutoDeployTrigger-aecf934f-2618-4144-b094-760dd25b50b2.yml'
      - '.github/workflows/setup-azure.yml'
      - '.github/workflows/release-customer.yml'
      - 'Start-DocIntelSetup.ps1'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'infra/**'
      - 'scripts/**'
      - 'Directory.*.props'
      - 'DocIntel.slnx'
      - 'NuGet.config'
      - 'Dockerfile'
      - '.dockerignore'
      - 'Deploy-DocIntelAzure.ps1'
      - '.github/workflows/ca-docintel-dev-AutoDeployTrigger-aecf934f-2618-4144-b094-760dd25b50b2.yml'
      - '.github/workflows/setup-azure.yml'
      - '.github/workflows/release-customer.yml'
      - 'Start-DocIntelSetup.ps1'
  workflow_call:
    inputs:
      validation_only:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      validation_only:
        description: Run all validation without deploying the existing Azure application.
        type: boolean
        default: false
      upgrade_legacy_sample_defaults:
        description: One-time upgrade of the original version-1 Fabrikam sample to gpt-5-mini; customized profiles are not changed.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docintel-azure-${{ vars.AZURE_RESOURCE_GROUP || 'Docintel' }}-${{ vars.AZURE_CONTAINER_APP_NAME || 'ca-docintel-dev' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore locked dependencies from NuGet.org
        shell: pwsh
        run: |
          dotnet restore DocIntel.slnx --configfile NuGet.config --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build every project with warnings as errors
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Recurse -Filter '*.csproj' |
            Where-Object { $_.FullName -notmatch '[/\\](bin|obj)[/\\]' }
          foreach ($project in $projects) {
            dotnet build $project.FullName -c Release --no-restore --nologo -warnaserror -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run .NET and browser/HTTP/recovery tests
        shell: pwsh
        run: |
          dotnet test tests/DocIntel.Tests/DocIntel.Tests.csproj -c Release --no-build --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = Get-ChildItem tests/DocIntel.Ui.Tests -Filter '*.test.cjs' | Select-Object -ExpandProperty FullName
          node --test $tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate infrastructure and deployment guards without deployment
        shell: pwsh
        run: |
          az bicep build --file infra/main.bicep --outfile infra/azuredeploy.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          az bicep build --file infra/decision-connection.bicep --stdout > $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/Deploy-DocIntelAzure.Tests.ps1
          ./tests/Setup-DocIntelGitHub.Tests.ps1
          ./tests/Sync-DocIntelDecision.Tests.ps1
          ./tests/Wait-DocIntelReady.Tests.ps1
          ./tests/Install-DocIntelCustomer.Tests.ps1
          ./tests/DocIntelCustomerBundle.Tests.ps1
          ./tests/Connect-DocIntelDirectory.Tests.ps1
          ./tests/Approve-DocIntelDirectory.Tests.ps1
          python3 -B -m unittest discover -s tests -p test_directory_probe.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python3 -B -m unittest discover -s .github/tests -p test_decision_diagnostic.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: docker/setup-buildx-action@v3
      - name: Build the container without publishing
        id: validation_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: docintel:validation
          platforms: linux/amd64
          outputs: type=oci,dest=${{ runner.temp }}/docintel-validation-image.tar
          provenance: mode=max
          sbom: true
      - name: Build the publication-free customer installer
        shell: pwsh
        env:
          IMAGE_DIGEST: ${{ steps.validation_image.outputs.digest }}
        run: |
          ./scripts/Build-DocIntelCustomerBundle.ps1 -Version "v0.0.0-ci.$env:GITHUB_RUN_ID" `
            -ImageSource CustomerRegistryBuild -SourceCommit $env:GITHUB_SHA `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'customer-installer')
          "The application was validated as OCI image $env:IMAGE_DIGEST. This installer builds the same source commit privately in the customer's ACR; it does not depend on that image being published." |
            Set-Content (Join-Path $env:RUNNER_TEMP 'customer-installer\BUILD-INFO.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: customer-setup
          path: ${{ runner.temp }}/customer-installer/
          if-no-files-found: error
          overwrite: true

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DOCINTEL_DEPLOY_ENABLED == 'true' && !inputs.validation_only
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: docintel-dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY || 'acrdocinteldevokjs3fevazuto' }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME || 'ca-docintel-dev' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'Docintel' }}
      DOCINTEL_CONTAINER_NAME: ${{ vars.DOCINTEL_CONTAINER_NAME }}
      LEGACY_SAMPLE_REPAIR: ${{ inputs.upgrade_legacy_sample_defaults && 'true' || 'false' }}
      DOCINTEL_DECISION_RESOURCE_ID: ${{ vars.DOCINTEL_DECISION_RESOURCE_ID }}
      DOCINTEL_DECISION_ENDPOINT: ${{ vars.DOCINTEL_DECISION_ENDPOINT }}
      DOCINTEL_DECISION_DEPLOYMENT: ${{ vars.DOCINTEL_DECISION_DEPLOYMENT }}
    steps:
      - uses: actions/checkout@v4
      - name: Prevent mixed personal and legacy Azure identities
        env:
          PERSONAL_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PERSONAL_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          PERSONAL_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [[ -n "$PERSONAL_CLIENT_ID" || -n "$PERSONAL_TENANT_ID" || -n "$PERSONAL_SUBSCRIPTION_ID" ]]; then
            if [[ -z "$PERSONAL_CLIENT_ID" || -z "$PERSONAL_TENANT_ID" || -z "$PERSONAL_SUBSCRIPTION_ID" ]]; then
              echo "::error::Set AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID together."
              exit 1
            fi
          fi
      - name: Sign in to Azure using federation
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID || secrets.CADOCINTELDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID || secrets.CADOCINTELDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID || secrets.CADOCINTELDEV_AZURE_SUBSCRIPTION_ID }}
      - name: Authenticate to the registry with the federated identity
        run: az acr login --name "$AZURE_CONTAINER_REGISTRY"
      - name: Reconcile the native Decision connection without changing other providers
        shell: pwsh
        run: |
          $target = @{ ResourceGroup = $env:AZURE_RESOURCE_GROUP
            ContainerAppName = $env:AZURE_CONTAINER_APP_NAME; ContainerName = $env:DOCINTEL_CONTAINER_NAME }
          ./scripts/Wait-DocIntelReady.ps1 @target -ConfigurationOnly -BeforeDecisionSetup
          $preview = ./scripts/Sync-DocIntelDecision.ps1 @target
          '### Native Microsoft Decision deployment plan' >> $env:GITHUB_STEP_SUMMARY
          '```json' >> $env:GITHUB_STEP_SUMMARY
          ($preview.Plan | ConvertTo-Json -Depth 30) >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          ./scripts/Sync-DocIntelDecision.ps1 @target -Mode Apply -Confirmation CONNECT `
            -ExpectedPlanHash $preview.PlanHash
      - name: Check infrastructure setup before publishing a release
        shell: pwsh
        run: |
          ./scripts/Wait-DocIntelReady.ps1 -ConfigurationOnly -ResourceGroup $env:AZURE_RESOURCE_GROUP `
            -ContainerAppName $env:AZURE_CONTAINER_APP_NAME -ContainerName $env:DOCINTEL_CONTAINER_NAME
      - uses: docker/setup-buildx-action@v3
      - name: Build and push the validated application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.AZURE_CONTAINER_APP_NAME }}:${{ github.sha }}
      - name: Deploy the validated image
        run: |
          container_args=()
          if [[ -n "$DOCINTEL_CONTAINER_NAME" ]]; then
            container_args=(--container-name "$DOCINTEL_CONTAINER_NAME")
          fi
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${AZURE_CONTAINER_REGISTRY}.azurecr.io/${AZURE_CONTAINER_APP_NAME}:${GITHUB_SHA}" \
            --set-env-vars "Readiness__UpgradeLegacySampleDefaults=${LEGACY_SAMPLE_REPAIR:-false}" \
              "Readiness__ProbeModelsOnStartup=true" \
            "${container_args[@]}"
      - name: Verify native Decision with the deployed runtime identity
        run: python3 -B .github/scripts/decision_diagnostic.py
      - name: Verify the released image and revision readiness
        shell: pwsh
        run: |
          ./scripts/Wait-DocIntelReady.ps1 -ResourceGroup $env:AZURE_RESOURCE_GROUP `
            -ContainerAppName $env:AZURE_CONTAINER_APP_NAME -ContainerName $env:DOCINTEL_CONTAINER_NAME `
            -ExpectedImage "$($env:AZURE_CONTAINER_REGISTRY).azurecr.io/$($env:AZURE_CONTAINER_APP_NAME):$($env:GITHUB_SHA)"
