name: Trigger auto deployment for ca-docintel-dev

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/ca-docintel-dev-AutoDeployTrigger-aecf934f-2618-4144-b094-760dd25b50b2.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CADOCINTELDEV_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CADOCINTELDEV_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CADOCINTELDEV_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acrdocinteldevokjs3fevazuto.azurecr.io
          registryUsername: ${{ secrets.CADOCINTELDEV_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CADOCINTELDEV_REGISTRY_PASSWORD }}
          containerAppName: ca-docintel-dev
          resourceGroup: Docintel
          imageToBuild: acrdocinteldevokjs3fevazuto.azurecr.io/ca-docintel-dev:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


