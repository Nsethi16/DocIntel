            <div class="graph-inspector-item" onclick="onGraphEntityValueFilterChanged(${JSON.stringify(e.pairKey).replace(/"/g, '&quot;')})">
              <div style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary);text-transform:uppercase;">${escapeHtml(e.entityName)}</div>
              <div style="font-weight:600;font-size:13.5px;color:var(--text-primary);">${escapeHtml(e.entityValue)}</div>
              <div style="font-family:var(--font-mono);font-size:10.5px;color:var(--accent);">Filter graph to this entity →</div>
            </div>
          `).join('')}
        `;
      } else {
        inspectorHtml = `
          <div>
            <div style="font-size:14.5px;font-weight:600;color:var(--text-primary);">Entity Knowledge Graph</div>
            <div style="font-size:12.5px;color:var(--text-secondary);margin-top:3px;">
              Showing <strong>${docNodes.length}</strong> document slice${docNodes.length === 1 ? '' : 's'} connected across <strong>${entityNodes.length}</strong> filtered entit${entityNodes.length === 1 ? 'y' : 'ies'}. Click any node to inspect connections or filter by entity above.
            </div>
          </div>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);text-transform:uppercase;margin-top:4px;">
            Active Entities (${entityNodes.length})
          </div>
          ${entityNodes.map(e => `
            <div class="graph-inspector-item" onclick="focusGraphNode('${escapeHtml(e.id)}')">
              <div style="display:flex;align-items:center;justify-content:space-between;">
                <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--text-secondary);text-transform:uppercase;">${escapeHtml(e.entityName)}</span>
                <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--accent-ink);">${e.connectedDocs.length} doc${e.connectedDocs.length === 1 ? '' : 's'}</span>
              </div>
              <div style="font-weight:600;font-size:13.5px;color:var(--text-primary);">${escapeHtml(e.entityValue)}</div>
            </div>
          `).join('')}
        `;
      }

      container.innerHTML = `
        <div class="graph-canvas-card">
          ${docNodes.length === 0 ? `
            <div style="margin:auto;text-align:center;color:var(--text-secondary);padding:32px;">
              No documents or entities match the current entity filters.<br/><br/>
              <button type="button" class="ghost-action-btn" onclick="resetGraphFilters()">Reset Entity Filters</button>
            </div>
          ` : `
            <svg class="graph-svg" id="entityGraphSvg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
              <g id="entityGraphViewport" transform="translate(${graphPanX}, ${graphPanY}) scale(${graphZoom})">
                <text x="${docX}" y="28" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#8f92a6">DOCUMENTS / SLICES (${docNodes.length})</text>
                <text x="${entX}" y="28" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" font-weight="600" letter-spacing="0.08em" fill="#8f92a6">EXTRACTED ENTITIES (${entityNodes.length})</text>
                ${edgesSvg}
                ${docNodesSvg}
                ${entityNodesSvg}
              </g>
            </svg>
          `}

          <div class="graph-floating-hud">
            <div class="graph-legend">
              <span><i class="legend-dot" style="background:#16161d;"></i>Document Slice</span>
              <span><i class="legend-dot" style="background:#4b72fe;"></i>Identifier</span>
              <span><i class="legend-dot" style="background:#0d9488;"></i>Party / Customer</span>
              <span><i class="legend-dot" style="background:#d97706;"></i>Financial</span>
              <span><i class="legend-dot" style="background:#7c3aed;"></i>Metadata</span>
            </div>
            <div class="graph-zoom-bar">
              <button type="button" class="text-link-btn" onclick="zoomGraphBy(-0.15)">−</button>
              <span>${Math.round(graphZoom * 100)}%</span>
              <button type="button" class="text-link-btn" onclick="zoomGraphBy(0.15)">+</button>
              <button type="button" class="text-link-btn" onclick="zoomGraphBy(0)">Reset</button>
            </div>
          </div>
        </div>

        <aside class="graph-inspector-card">
          ${inspectorHtml}
        </aside>
      `;

      attachGraphSvgInteractivity();
    }

    function attachGraphSvgInteractivity() {
      const svg = document.getElementById('entityGraphSvg');
      if (!svg) return;

      let draggingNodeId = null;
      let isPanning = false;
      let startClientX = 0;
      let startClientY = 0;

      svg.onmousedown = (e) => {
        const nodeEl = e.target.closest('.graph-node');
        startClientX = e.clientX;
        startClientY = e.clientY;
        if (nodeEl) {
          draggingNodeId = nodeEl.getAttribute('data-node-id');
        } else {
          isPanning = true;
        }
      };

      window.onmousemove = (e) => {
        if (!draggingNodeId && !isPanning) return;
        const dx = (e.clientX - startClientX) / graphZoom;
        const dy = (e.clientY - startClientY) / graphZoom;
        startClientX = e.clientX;
        startClientY = e.clientY;

        if (draggingNodeId) {
          const nodeEl = svg.querySelector(`.graph-node[data-node-id="${CSS.escape(draggingNodeId)}"]`);
          if (nodeEl) {
            const match = /translate\(([-\d.]+),\s*([-\d.]+)\)/.exec(nodeEl.getAttribute('transform') || '');
            if (match) {
              const nx = parseFloat(match[1]) + dx;
              const ny = parseFloat(match[2]) + dy;
              graphCustomNodePositions[draggingNodeId] = { x: nx, y: ny };
              renderDocumentGraphCanvasOnly();
            }
          }
        } else if (isPanning) {
          graphPanX += dx * graphZoom;
          graphPanY += dy * graphZoom;
          const vp = document.getElementById('entityGraphViewport');
          if (vp) {
            vp.setAttribute('transform', `translate(${graphPanX}, ${graphPanY}) scale(${graphZoom})`);
          }
        }
      };

      window.onmouseup = () => {
        draggingNodeId = null;
        isPanning = false;
      };
    }

    init();
  </script>
</body>
</html>
