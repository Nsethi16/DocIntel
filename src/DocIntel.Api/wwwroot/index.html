<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocIntel — Document Intelligence</title>
  <link rel="preconnect" href="https://fonts.cdnfonts.com" />
  <link href="https://fonts.cdnfonts.com/css/overused-grotesk" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/shell.css" />
  <link rel="stylesheet" href="/index.css" />
</head>
<body>
  <!-- Single Collapsible Left Document Drawer -->
  <aside class="doc-drawer" id="docListPane">
    <div class="drawer-top">
      <div class="drawer-brand-row" style="height:28px;">
        <div class="tenant-switcher-wrap">
          <select class="tenant-select" id="tenantSelectDropdown" data-change="onTenantSwitched_value" title="Select tenant workspace"></select>
        </div>
        <button type="button" class="icon-toggle-btn" title="Hide documents drawer" data-click="toggleDocListPane">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
            <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
          </svg>
        </button>
      </div>

      <div class="workspace-mode-switcher" role="tablist" aria-label="Workspace mode">
        <button type="button" class="workspace-mode-btn active" id="btnModeDocuments" data-click="setWorkspaceMode_arg" data-args="[&quot;documents&quot;]">Documents</button>
        <button type="button" class="workspace-mode-btn" id="btnModeGraph" data-click="setWorkspaceMode_arg" data-args="[&quot;graph&quot;]">Graph</button>
        <button type="button" class="workspace-mode-btn" id="btnModeAsk" data-click="setWorkspaceMode_arg" data-args="[&quot;ask&quot;]">✦ Ask AI</button>
      </div>

      <div class="search-box" id="docSearchBoxWrap">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="8.5" cy="8.5" r="5.5" />
          <path d="M13 13l4 4" stroke-linecap="round" />
        </svg>
        <input type="text" id="docSearchInput" placeholder="Search name or content..." data-input="renderDocumentList" />
      </div>
    </div>

    <div class="drawer-subbar">
      <span id="docListCountLabel">0 documents</span>
    </div>

    <div class="doc-items-scroll" id="docItemsList"></div>

    <div class="drawer-footer">
      <label class="btn-upload-primary" id="drawerUploadLabel" title="Upload a PDF document">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M10 13V4m0 0L6.5 7.5M10 4l3.5 3.5M4 15.5h12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="uploadBtnLabel">Upload PDF</span>
        <input type="file" id="docUploadInput" accept=".pdf" style="display:none" data-change="uploadAndRunTenantDocument_self" />
      </label>
      <a href="/admin.html" id="adminStudioSwitchLink" class="admin-switch-link" title="Open Agent Harness Admin Studio" data-click="openAdminForTenant">
        <span>Agent Harness Admin</span>
        <span>↗</span>
      </a>
      <button type="button" id="identitySignOut" class="admin-switch-link" data-click="signOut" hidden>
        Sign out
      </button>
    </div>
  </aside>

  <!-- Main Workspace ("Project Meridian" Header + Floating White-Pill Tabs) -->
  <main class="workspace-main">
    <header class="meridian-header">
      <div class="meridian-top-row">
        <div class="meridian-identity">
          <button type="button" class="icon-toggle-btn" id="btnHeaderExpandDocList" style="display:none;align-self:center;" title="Show documents drawer" data-click="toggleDocListPane">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
              <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
            </svg>
          </button>
          <h1 class="meridian-title" id="selectedDocTitle">Select or upload a document</h1>
          <span class="meridian-folder-meta" id="selectedDocFolderMeta">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 6a2 2 0 012-2h3.2l1.8 2h6a2 2 0 012 2v6.5a2 2 0 01-2 2h-11a2 2 0 01-2-2V6z" />
            </svg>
            <span id="selectedDocMetaText">—</span>
          </span>
        </div>

        <div class="meridian-actions">
          <div id="sliceSelectorRow" style="display:flex;align-items:center;gap:6px;"></div>
          <button type="button" class="ghost-action-btn" id="btnHeaderExportJson" data-click="exportSelectedJobJson" title="Download extracted JSON">Export</button>
        </div>
      </div>

      <div class="meridian-nav-row" id="meridianNavRow">
        <nav class="meridian-tabs" id="insightsTabBar" aria-label="Document views">
          <button type="button" class="meridian-tab active" data-tab="insights" data-click="setDocResultTab_arg" data-args="[&quot;insights&quot;]">Insights</button>
          <button type="button" class="meridian-tab" data-tab="document" data-click="setDocResultTab_arg" data-args="[&quot;document&quot;]">View Document</button>
          <button type="button" class="meridian-tab" data-tab="entities" data-click="setDocResultTab_arg" data-args="[&quot;entities&quot;]">Entities</button>
          <button type="button" class="meridian-tab" data-tab="structured" data-click="setDocResultTab_arg" data-args="[&quot;structured&quot;]">Structured Data</button>
          <button type="button" class="meridian-tab" data-tab="metadata" data-click="setDocResultTab_arg" data-args="[&quot;metadata&quot;]">Metadata</button>
        </nav>
      </div>
    </header>

    <section class="workspace-body" id="docCenterBody" data-tab="insights"></section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/identity.js"></script>
  <script src="/ask-ai.js"></script>
  <script src="/evidence.js"></script>
  <script src="/shared/ui.js"></script>
  <script src="/shared/actions.js"></script>
  <script src="/workspace.js"></script>
</body>
</html>
