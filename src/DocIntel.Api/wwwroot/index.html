<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocIntel — Document Intelligence</title>
  <link rel="preconnect" href="https://fonts.cdnfonts.com" />
  <link href="https://fonts.cdnfonts.com/css/overused-grotesk" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --header-surface: #f6f6f8;
      --drawer-surface: #f6f6f8;
      --canvas-bg: #ffffff;
      --surface-soft: #f0f0f5;
      --line: #e3e1ec;
      --line-subtle: #ebe9f2;
      --text-primary: #16161d;
      --text-body: #2c2e3c;
      --text-secondary: #5d6074;
      --text-muted: #8f92a6;
      --monogram-bg: #16161d;
      --accent: #3d56e0;
      --accent-mid: #4b72fe;
      --accent-soft: #eef0ff;
      --accent-border: #b5bcf3;
      --accent-ink: #3945a8;
      --status-ok: #138fa6;
      --status-run: #4b72fe;
      --status-err: #c43d4b;
      --font-sans: "Overused Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif: "Overused Grotesk", system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      background: var(--canvas-bg);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================================================
       Single Collapsible Left Document Drawer (280px <-> 0px)
       ========================================================================= */
    .doc-drawer {
      width: 280px;
      background: var(--drawer-surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.16s ease;
      overflow: hidden;
      user-select: none;
    }

    .doc-drawer.collapsed {
      width: 0;
      border-right: 0;
      opacity: 0;
      pointer-events: none;
    }

    .drawer-top {
      padding: 16px 14px 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .drawer-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tenant-switcher-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .tenant-mini-monogram {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--monogram-bg);
      color: #ffffff;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .tenant-mini-monogram::after,
    .meridian-monogram::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2.5px;
      background: linear-gradient(90deg, #37d7fa 0%, #4b72fe 40%, #ff8df2 75%, #ff8705 100%);
    }

    .tenant-select {
      flex: 1;
      min-width: 0;
      border: 1px solid transparent;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      text-overflow: ellipsis;
    }

    .tenant-select:hover {
      background: #efeee9;
    }

    .icon-toggle-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .icon-toggle-btn:hover {
      background: #eae9e4;
      color: var(--text-primary);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      width: 13.5px;
      height: 13.5px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      padding: 7px 10px 7px 30px;
      border: 1px solid #e4e3dd;
      border-radius: 8px;
      font-size: 12.5px;
      font-family: inherit;
      background: #ffffff;
      color: var(--text-primary);
      transition: border-color 0.15s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: #b5b3ac;
    }

    .drawer-subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 4px 14px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .ghost-action-btn {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text-primary);
      border-radius: 7px;
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.14s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 1px 2px rgba(22, 22, 29, 0.04);
    }

    .ghost-action-btn:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent-ink);
    }

    .doc-items-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .doc-row {
      padding: 9px 11px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.12s ease;
    }

    .doc-row:hover {
      background: var(--surface-soft);
    }

    .doc-row.selected {
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(22, 22, 29, 0.05), 0 0 0 1px var(--line);
    }

    .doc-row-main {
      flex: 1;
      min-width: 0;
    }

    .doc-row-name {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: -0.005em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .doc-row.selected .doc-row-name {
      font-weight: 600;
      color: var(--accent-ink);
    }

    .doc-row-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: var(--status-ok);
      flex-shrink: 0;
    }

    .status-dot.running {
      background: var(--status-run);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

    .status-dot.failed {
      background: var(--status-err);
    }

    .drawer-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-upload-primary {
      width: 100%;
      background: var(--monogram-bg);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8.5px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s ease;
    }

    .btn-upload-primary:hover {
      background: #1f2326;
    }

    .admin-switch-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 4px 2px;
      transition: color 0.12s ease;
    }

    .admin-switch-link:hover {
      color: var(--text-primary);
    }

    /* =========================================================================
       Main Workspace — "Project Meridian" Header & Floating White-Pill Tabs
       ========================================================================= */
    .workspace-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--canvas-bg);
    }

    .meridian-header {
      background: var(--header-surface);
      border-bottom: 1px solid var(--line);
      padding: 22px 28px 12px 28px;
      flex-shrink: 0;
    }

    .meridian-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .meridian-identity {
      display: flex;
      align-items: baseline;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }

    .meridian-monogram {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--monogram-bg);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(22, 22, 29, 0.12);
    }

    .meridian-title {
      font-family: var(--font-sans);
      font-size: 21px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
      letter-spacing: -0.025em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .meridian-folder-meta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .meridian-folder-meta svg {
      width: 13.5px;
      height: 13.5px;
      color: var(--text-muted);
    }

    .meridian-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .meridian-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: nowrap;
    }

    .meridian-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      min-width: 0;
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
    }

    .meridian-tab {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meridian-tab:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.55);
    }

    .meridian-tab.active {
      background: #ffffff;
      border: none;
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(22, 22, 29, 0.06);
    }

    .tab-count {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .meridian-tab.active .tab-count {
      color: var(--text-secondary);
    }

    .meridian-slice-select {
      border: 1px solid #dfddd6;
      background: #ffffff;
      border-radius: 6px;
      padding: 3.5px 8px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      font-family: inherit;
      cursor: pointer;
      width: 116px;
      text-overflow: ellipsis;
      outline: none;
    }

    .meridian-slice-select:hover {
      border-color: #c5c3ba;
    }

    /* =========================================================================
       Main Content Area (Calm, Borderless Editorial Sections)
       ========================================================================= */
    .workspace-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px 36px 40px 36px;
    }

    .workspace-body[data-tab="document"] {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .pdf-full-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f3f3f2;
      display: block;
    }

    .pdf-side-by-side {
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--line);
      gap: 1px;
    }

    .pdf-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100%;
      background: #ffffff;
    }

    .pdf-pane-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      background: var(--header-surface);
      border-bottom: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .pdf-pane-bar strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .content-column {
      width: 100%;
      max-width: 100%;
    }

    .slices-wide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
      gap: 20px 32px;
      align-items: start;
    }

    .packet-summary-line {
      margin: 0 0 24px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .slice-section {
      padding: 18px 20px;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(22, 22, 29, 0.04);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .slice-section:hover {
      border-color: #c9c5dc;
      box-shadow: 0 4px 18px rgba(22, 22, 29, 0.06);
    }

    .slice-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .slice-section-title {
      font-family: var(--font-sans);
      font-size: 16.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      margin: 0;
    }

    .slice-section-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .text-link-btn {
      background: var(--header-surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: all 0.14s ease;
    }

    .text-link-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-ink);
    }

    .insight-prose {
      font-size: 14px;
      line-height: 1.62;
      color: var(--text-body);
      max-width: 100%;
      margin: 0 0 12px 0;
      white-space: pre-wrap;
    }

    /* Filter pills in ExtractBench Pro .xp-chip style */
    .filter-pill-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-pill-btn {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .filter-pill-btn:hover {
      border-color: #c9c5dc;
    }

    .filter-pill-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-ink);
      font-weight: 600;
    }

    /* Clean Tables with IBM Plex Mono headers */
    .clean-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .clean-table th,
    .clean-table td {
      text-align: left;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .clean-table th {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--line);
    }

    .clean-table tbody tr:hover td {
      background: var(--header-surface);
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px 28px;
      margin: 0 0 24px 0;
    }

    .kv-item dt {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .kv-item dd {
      margin: 0;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-primary);
      word-break: break-word;
    }

    /* Document Graph by Entities View */
    .workspace-body[data-tab="graph"] {
      padding: 18px 28px 24px 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .graph-shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      min-height: 0;
    }

    .graph-filter-bar {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .graph-filter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .graph-controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .graph-input,
    .graph-select {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 7px;
      outline: none;
    }

    .graph-input:focus,
    .graph-select:focus {
      border-color: var(--accent);
      background: #ffffff;
    }

    .graph-workbench {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 14px;
    }

    @media (max-width: 1024px) {
      .graph-workbench {
        grid-template-columns: 1fr;
      }
    }

    .graph-canvas-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 440px;
      background-image: radial-gradient(#e3e1ec 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .graph-svg {
      width: 100%;
      height: 100%;
      flex: 1;
      cursor: grab;
      user-select: none;
    }

    .graph-svg:active {
      cursor: grabbing;
    }

    .graph-floating-hud {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .graph-legend,
    .graph-zoom-bar {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      pointer-events: auto;
      box-shadow: 0 2px 8px rgba(22, 22, 29, 0.05);
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }

    .graph-inspector-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      min-height: 0;
    }

    .graph-inspector-item {
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 10px 12px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .graph-inspector-item:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 24px;
      background: var(--monogram-bg);
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      display: none;
      z-index: 999;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    }
  </style>
</head>
<body>
  <!-- Single Collapsible Left Document Drawer -->
  <aside class="doc-drawer" id="docListPane">
    <div class="drawer-top">
      <div class="drawer-brand-row">
        <div class="tenant-switcher-wrap">
          <select class="tenant-select" id="tenantSelectDropdown" onchange="onTenantSwitched(this.value)" title="Select tenant workspace"></select>
        </div>
        <button type="button" class="icon-toggle-btn" title="Hide documents drawer" onclick="toggleDocListPane()">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
            <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
          </svg>
        </button>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="8.5" cy="8.5" r="5.5" />
          <path d="M13 13l4 4" stroke-linecap="round" />
        </svg>
        <input type="text" id="docSearchInput" placeholder="Search name or content..." oninput="renderDocumentList()" />
      </div>
    </div>

    <div class="drawer-subbar">
      <span id="docListCountLabel">0 documents</span>
    </div>

    <div class="doc-items-scroll" id="docItemsList"></div>

    <div class="drawer-footer">
      <label class="btn-upload-primary" title="Upload a PDF document">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M10 13V4m0 0L6.5 7.5M10 4l3.5 3.5M4 15.5h12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="uploadBtnLabel">Upload PDF</span>
        <input type="file" id="docUploadInput" accept=".pdf" style="display:none" onchange="uploadAndRunTenantDocument(this)" />
      </label>
      <a href="/admin.html" class="admin-switch-link" title="Open Agent Harness Admin Studio">
        <span>Agent Harness Admin</span>
        <span>↗</span>
      </a>
    </div>
  </aside>

  <!-- Main Workspace ("Project Meridian" Header + Floating White-Pill Tabs) -->
  <main class="workspace-main">
    <header class="meridian-header">
      <div class="meridian-top-row">
        <div class="meridian-identity">
          <button type="button" class="icon-toggle-btn" id="btnHeaderExpandDocList" style="display:none;align-self:center;" title="Show documents drawer" onclick="toggleDocListPane()">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
              <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
            </svg>
          </button>
          <h1 class="meridian-title" id="selectedDocTitle">Select or upload a document</h1>
          <span class="meridian-folder-meta" id="selectedDocFolderMeta">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 6a2 2 0 012-2h3.2l1.8 2h6a2 2 0 012 2v6.5a2 2 0 01-2 2h-11a2 2 0 01-2-2V6z" />
            </svg>
            <span id="selectedDocMetaText">—</span>
          </span>
        </div>

        <div class="meridian-actions">
          <div id="sliceSelectorRow" style="display:flex;align-items:center;gap:6px;"></div>
          <button type="button" class="ghost-action-btn" onclick="exportSelectedJobJson()" title="Download extracted JSON">Export</button>
        </div>
      </div>

      <div class="meridian-nav-row">
        <nav class="meridian-tabs" id="insightsTabBar" aria-label="Document views">
          <button type="button" class="meridian-tab active" data-tab="insights" onclick="setDocResultTab('insights')">Insights</button>
          <button type="button" class="meridian-tab" data-tab="document" onclick="setDocResultTab('document')">View Document</button>
          <button type="button" class="meridian-tab" data-tab="entities" onclick="setDocResultTab('entities')">Entities</button>
          <button type="button" class="meridian-tab" data-tab="structured" onclick="setDocResultTab('structured')">Structured Data</button>
          <button type="button" class="meridian-tab" data-tab="metadata" onclick="setDocResultTab('metadata')">Metadata</button>
        </nav>
      </div>
    </header>

    <section class="workspace-body" id="docCenterBody" data-tab="insights"></section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    let tenants = [];
    let currentTenant = null;
    let tenantJobs = [];
    let selectedJobId = null;
    let selectedSliceIndex = -1; // -1 = All Slices
    let docResultTab = 'insights'; // 'insights' | 'document' | 'entities' | 'graph' | 'structured' | 'metadata' | 'prompt:<id>'
    let selectedEntityCategory = 'ALL';
    let selectedPromptFilterView = 'ALL'; // 'ALL' | 'MATCHED' | 'SKIPPED'
    let graphScope = 'ALL_DOCS'; // 'ALL_DOCS' | 'CURRENT_DOC'
    let graphSelectedEntityNames = new Set(); // empty = All entity names
    let graphSelectedEntityValuePair = 'ALL'; // 'ALL' or 'EntityName||EntityValue'
    let graphEntitySearchQuery = '';
    let graphFocusedNodeId = null;
    let graphZoom = 1;
    let graphPanX = 0;
    let graphPanY = 0;
    let graphCustomNodePositions = {};
    let jobPollTimer = null;

    function getMonogram(name) {
      return String(name || 'DI')
        .split(/[\s&-]+/)
        .filter(Boolean)
        .map(w => w[0])
        .join('')
        .substring(0, 2)
        .toUpperCase() || 'DI';
    }

    function cleanInsightText(raw) {
      if (!raw) return '';
      return String(raw)
        .replace(/^\[[^\]]*Insight\]\s*/i, '')
        .replace(/\s*\(Guided by:[^)]*\)\s*$/i, '')
        .trim();
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2200);
    }

    function toggleDocListPane() {
      const pane = document.getElementById('docListPane');
      const expandBtn = document.getElementById('btnHeaderExpandDocList');
      if (!pane) return;
      const isCollapsed = pane.classList.toggle('collapsed');
      if (expandBtn) {
        expandBtn.style.display = isCollapsed ? 'inline-flex' : 'none';
      }
    }

    async function init() {
      const resp = await fetch('/api/harness/tenants');
      tenants = await resp.json();
      currentTenant = tenants[0] || null;
      renderTenantSelect();
      await loadTenantJobs();
    }

    function renderTenantSelect() {
      const sel = document.getElementById('tenantSelectDropdown');
      sel.innerHTML = '';
      tenants.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.tenantId;
        opt.textContent = t.displayName;
        if (currentTenant && currentTenant.tenantId === t.tenantId) opt.selected = true;
        sel.appendChild(opt);
      });
    }

    async function onTenantSwitched(tenantId) {
      currentTenant = tenants.find(t => t.tenantId === tenantId) || tenants[0] || null;
      selectedJobId = null;
      selectedSliceIndex = -1;
      renderTenantSelect();
      await loadTenantJobs();
    }

    async function loadTenantJobs(preferredJobId) {
      if (!currentTenant) return;
      const resp = await fetch(`/api/harness/tenants/${encodeURIComponent(currentTenant.tenantId)}/jobs`);
      if (!resp.ok) return;
      tenantJobs = await resp.json();

      if (preferredJobId) {
        selectedJobId = preferredJobId;
      } else if (!selectedJobId || !tenantJobs.some(j => j.jobId === selectedJobId)) {
        selectedJobId = tenantJobs.length > 0 ? tenantJobs[0].jobId : null;
        selectedSliceIndex = -1;
      }

      renderDocumentList();
      renderSelectedDocument();
      scheduleJobPollingIfNeeded();
    }

    function scheduleJobPollingIfNeeded() {
      if (jobPollTimer) {
        clearTimeout(jobPollTimer);
        jobPollTimer = null;
      }
      if (tenantJobs.some(j => j.status === 'Queued' || j.status === 'Running')) {
        jobPollTimer = setTimeout(() => loadTenantJobs(selectedJobId), 2000);
      }
    }

    function buildJobSearchCorpus(job) {
      const segs = job.segments || [];
      const markdownAndContent = segs.map(s => [
        s.identifiedDocumentName || '',
        s.documentTypeName || '',
        s.markdown || '',
        s.bodyText || '',
        s.translatedText || '',
        s.insightSummary || '',
        (s.footers || []).join(' ')
      ].join('\n')).join('\n');

      const entitiesText = (job.extractedEntities || [])
        .map(e => `${e.name || ''} ${e.value || ''}`)
        .join(' ');

      return `${job.fileName || ''}\n${job.jobId || ''}\n${job.packetSummary || ''}\n${entitiesText}\n${markdownAndContent}`;
    }

    function extractContentMatchSnippet(job, rawQuery) {
      if (!rawQuery) return '';
      const q = rawQuery.toLowerCase();
      if ((job.fileName || '').toLowerCase().includes(q)) return '';

      for (const s of (job.segments || [])) {
        const md = String(s.markdown || s.bodyText || s.translatedText || '')
          .replace(/<!--[\s\S]*?-->/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        const idx = md.toLowerCase().indexOf(q);
        if (idx >= 0) {
          const start = Math.max(0, idx - 22);
          const end = Math.min(md.length, idx + rawQuery.length + 34);
          const prefix = start > 0 ? '…' : '';
          const suffix = end < md.length ? '…' : '';
          return `p.${s.startPage}: "${prefix}${md.slice(start, end)}${suffix}"`;
        }
      }
      return '';
    }

    function renderDocumentList() {
      const container = document.getElementById('docItemsList');
      const rawQuery = (document.getElementById('docSearchInput').value || '').trim();
      const query = rawQuery.toLowerCase();

      const filtered = tenantJobs.filter(j => {
        if (!query) return true;
        const hay = buildJobSearchCorpus(j).toLowerCase();
        return hay.includes(query);
      });

      document.getElementById('docListCountLabel').textContent = `${filtered.length} document${filtered.length === 1 ? '' : 's'}`;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="padding:28px 12px;text-align:center;color:var(--text-secondary);font-size:12.5px;line-height:1.5;">
            No documents found.<br/>Upload a PDF below to get started.
          </div>
        `;
        return;
      }

      filtered.forEach(job => {
        const isSelected = job.jobId === selectedJobId;
        const dt = job.createdAtUtc ? new Date(job.createdAtUtc) : new Date();
        const dateStr = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const segs = job.segments || [];
        const dotCls = job.status === 'Completed' ? '' : (job.status === 'Failed' ? 'failed' : 'running');
        const snippet = extractContentMatchSnippet(job, rawQuery);

        const row = document.createElement('div');
        row.className = 'doc-row' + (isSelected ? ' selected' : '');
        row.title = `${job.fileName} (${job.status})`;
        row.onclick = () => {
          selectedJobId = job.jobId;
          selectedSliceIndex = -1;
          renderDocumentList();
          renderSelectedDocument();
        };

        row.innerHTML = `
          <div class="doc-row-main">
            <div class="doc-row-name">${escapeHtml(job.fileName)}</div>
            <div class="doc-row-meta">${escapeHtml(dateStr)} · ${job.totalPages || 0} pp${segs.length > 1 ? ` · ${segs.length} slices` : ''}</div>
            ${snippet ? `<div style="font-size:11px;color:var(--accent-ink);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(snippet)}</div>` : ''}
          </div>
          <span class="status-dot ${dotCls}" title="${escapeHtml(job.status)}"></span>
        `;
        container.appendChild(row);
      });
    }

    async function uploadAndRunTenantDocument(inputEl) {
      if (!currentTenant || !inputEl.files || !inputEl.files[0]) return;
      const file = inputEl.files[0];
      const lbl = document.getElementById('uploadBtnLabel');
      lbl.textContent = 'Uploading...';

      try {
        const fd = new FormData();
        fd.append('file', file);
        const resp = await fetch(`/api/harness/tenants/${encodeURIComponent(currentTenant.tenantId)}/jobs`, {
          method: 'POST',
          body: fd
        });
        if (resp.ok) {
          const accepted = await resp.json();
          showToast(`Submitted ${file.name}`);
          await loadTenantJobs(accepted.jobId);
        } else {
          showToast('Upload failed');
        }
      } finally {
        lbl.textContent = 'Upload PDF';
        inputEl.value = '';
      }
    }

    function setDocResultTab(tab) {
      docResultTab = tab;
      document.querySelectorAll('#insightsTabBar .meridian-tab').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      renderSelectedDocument();
    }

    function jumpToSlicePdf(sliceIndex) {
      selectedSliceIndex = sliceIndex;
      setDocResultTab('document');
    }

    function setEntityCategoryFilter(cat) {
      selectedEntityCategory = cat;
      renderSelectedDocument();
    }

    function setPromptFilterView(mode) {
      selectedPromptFilterView = mode;
      renderSelectedDocument();
    }

    function toggleGraphEntityNameFilter(entityName) {
      if (entityName === 'ALL') {
        graphSelectedEntityNames.clear();
      } else {
        if (graphSelectedEntityNames.has(entityName)) {
          graphSelectedEntityNames.delete(entityName);
        } else {
          graphSelectedEntityNames.add(entityName);
        }
      }
      graphFocusedNodeId = null;
      renderSelectedDocument();
    }

    function onGraphEntityValueFilterChanged(val) {
      graphSelectedEntityValuePair = val || 'ALL';
      graphFocusedNodeId = null;
      renderSelectedDocument();
    }

    function onGraphSearchInputChanged(val) {
      graphEntitySearchQuery = val || '';
      renderDocumentGraphCanvasOnly();
    }

    function setGraphScope(scope) {
      graphScope = scope;
      graphFocusedNodeId = null;
      graphCustomNodePositions = {};
      renderSelectedDocument();
    }

    function resetGraphFilters() {
      graphSelectedEntityNames.clear();
      graphSelectedEntityValuePair = 'ALL';
      graphEntitySearchQuery = '';
      graphFocusedNodeId = null;
      graphZoom = 1;
      graphPanX = 0;
      graphPanY = 0;
      graphCustomNodePositions = {};
      renderSelectedDocument();
    }

    function zoomGraphBy(delta) {
      if (delta === 0) {
        graphZoom = 1;
        graphPanX = 0;
        graphPanY = 0;
        graphCustomNodePositions = {};
      } else {
        graphZoom = Math.min(2.4, Math.max(0.55, +(graphZoom + delta).toFixed(2)));
      }
      renderDocumentGraphCanvasOnly();
    }

    function focusGraphNode(nodeId) {
      graphFocusedNodeId = (graphFocusedNodeId === nodeId) ? null : nodeId;
      renderDocumentGraphCanvasOnly();
    }

    function jumpFromGraphToSlice(jobId, sliceIdx) {
      selectedJobId = jobId;
      selectedSliceIndex = sliceIdx;
      renderDocumentList();
      setDocResultTab('document');
    }

    async function reevaluateSelectedJobPrompts() {
      const job = tenantJobs.find(j => j.jobId === selectedJobId);
      if (!job || !currentTenant) return;
      showToast('Evaluating Prompt Columns on PDF/Base64...');
      const resp = await fetch(`/api/harness/tenants/${encodeURIComponent(currentTenant.tenantId)}/jobs/${encodeURIComponent(job.jobId)}/evaluate-prompts`, {
        method: 'POST'
      });
      if (resp.ok) {
        const updatedJob = await resp.json();
        const idx = tenantJobs.findIndex(j => j.jobId === updatedJob.jobId);
        if (idx >= 0) tenantJobs[idx] = updatedJob;
        renderSelectedDocument();
        showToast('Prompt Columns updated');
      } else {
        showToast('Failed to evaluate prompts');
      }
    }

    function copyTextValue(val) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(String(val || ''));
      }
      showToast('Copied to clipboard');
    }

    function exportSelectedJobJson() {
      const job = tenantJobs.find(j => j.jobId === selectedJobId);
      if (!job) return;
      const blob = new Blob([JSON.stringify(job, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(job.fileName || 'document').replace(/\.pdf$/i, '')}-docintel-result.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Exported JSON');
    }

    function renderSelectedDocument() {
      const body = document.getElementById('docCenterBody');
      const sliceRow = document.getElementById('sliceSelectorRow');
      body.dataset.tab = docResultTab;

      const job = tenantJobs.find(j => j.jobId === selectedJobId);

      if (!job) {
        document.getElementById('selectedDocTitle').textContent = currentTenant ? currentTenant.displayName : 'Document Intelligence';
        document.getElementById('selectedDocMetaText').textContent = currentTenant ? currentTenant.tenantId : 'Idle';
        sliceRow.innerHTML = '';
        body.innerHTML = `
          <div class="content-column" style="padding:48px 0;color:var(--text-secondary);font-size:14px;">
            Select a document from the left drawer or upload a PDF to inspect results.
          </div>
        `;
        return;
      }

      const segs = job.segments || [];
      const cleanTitle = (job.fileName || 'Document').replace(/\.pdf$/i, '');
      document.getElementById('selectedDocTitle').textContent = cleanTitle;
      document.getElementById('selectedDocTitle').title = job.fileName;
      document.getElementById('selectedDocMetaText').textContent = `${job.totalPages || 0} pp`;

      const totalEntitiesCount = segs.reduce((acc, s) => acc + ((s.extractedEntities || []).length), 0);
      const totalStructuredCount = segs.reduce((acc, s) => {
        const de = s.dataExtraction;
        if (!de) return acc;
        return acc + ((de.fields || []).length) + ((de.tables || []).length);
      }, 0);

      const activeSegs = selectedSliceIndex === -1
        ? segs
        : segs.filter(s => s.segmentIndex === selectedSliceIndex);

      // Collect distinct Prompt Columns that matched the entity filter on the active document / slice selection
      const activePromptResults = activeSegs.flatMap(s =>
        (s.promptColumnResults && s.promptColumnResults.length > 0)
          ? s.promptColumnResults
          : (job.promptColumnResults || []).filter(r => r.segmentIndex === s.segmentIndex)
      );
      const matchedPromptColumnsMap = new Map();
      activePromptResults.forEach(r => {
        if (r && r.filterMatched && r.columnId && !matchedPromptColumnsMap.has(r.columnId)) {
          matchedPromptColumnsMap.set(r.columnId, {
            columnId: r.columnId,
            columnName: r.columnName || r.columnId
          });
        }
      });
      const matchedPromptColumns = [...matchedPromptColumnsMap.values()];

      // If current tab is a prompt column that does not apply to the newly selected slice/document, fall back to insights
      if (docResultTab.startsWith('prompt:')) {
        const activeColId = docResultTab.substring('prompt:'.length);
        if (!matchedPromptColumnsMap.has(activeColId)) {
          docResultTab = 'insights';
          body.dataset.tab = docResultTab;
        }
      }

      // Render core tabs + one individual tab per matched Prompt Column (e.g. ✨ Summary, ✨ Highlights)
      const tabBar = document.getElementById('insightsTabBar');
      const coreTabsHtml = [
        { id: 'insights', label: 'Insights' },
        { id: 'document', label: 'View Document' },
        { id: 'entities', label: `Entities${totalEntitiesCount > 0 ? ` <span class="tab-count">${totalEntitiesCount}</span>` : ''}` },
        { id: 'graph', label: 'Document Graph' },
        { id: 'structured', label: `Structured Data${totalStructuredCount > 0 ? ` <span class="tab-count">${totalStructuredCount}</span>` : ''}` },
        { id: 'metadata', label: 'Metadata' }
      ].map(t => `
        <button type="button" class="meridian-tab ${docResultTab === t.id ? 'active' : ''}" data-tab="${t.id}" onclick="setDocResultTab('${t.id}')">${t.label}</button>
      `).join('');

      const promptTabsHtml = matchedPromptColumns.map(col => {
        const tabId = `prompt:${col.columnId}`;
        const isActive = docResultTab === tabId;
        return `
          <button type="button" class="meridian-tab ${isActive ? 'active' : ''}" data-tab="${escapeHtml(tabId)}" onclick="setDocResultTab('${escapeHtml(tabId)}')" title="Prompt Column: ${escapeHtml(col.columnName)}">
            <span style="color:var(--accent);margin-right:4px;">✦</span>${escapeHtml(col.columnName)}
          </button>
        `;
      }).join('');

      tabBar.innerHTML = coreTabsHtml + promptTabsHtml;

      // Single clean slice dropdown on the right of the tab bar
      sliceRow.innerHTML = '';
      if (segs.length > 1) {
        const select = document.createElement('select');
        select.className = 'meridian-slice-select';
        if (docResultTab !== 'document') {
          const allOpt = document.createElement('option');
          allOpt.value = '-1';
          allOpt.textContent = `All slices (${segs.length})`;
          if (selectedSliceIndex === -1) allOpt.selected = true;
          select.appendChild(allOpt);
        }

        const activePdfSliceIdx = (docResultTab === 'document' && selectedSliceIndex === -1) ? 0 : selectedSliceIndex;

        segs.forEach(s => {
          const opt = document.createElement('option');
          opt.value = String(s.segmentIndex);
          const labelName = s.identifiedDocumentName || s.documentTypeName || `Slice ${s.segmentIndex + 1}`;
          opt.textContent = `Slice ${s.segmentIndex + 1}: ${labelName} (p.${s.startPage}–${s.endPage})`;
          if (activePdfSliceIdx === s.segmentIndex) opt.selected = true;
          select.appendChild(opt);
        });

        select.onchange = (e) => {
          selectedSliceIndex = parseInt(e.target.value, 10);
          renderSelectedDocument();
        };
        sliceRow.appendChild(select);
      }

      if (docResultTab === 'document' && segs.length > 0) {
        const focusedSeg = (selectedSliceIndex >= 0 ? segs.find(s => s.segmentIndex === selectedSliceIndex) : segs[0]) || segs[0];
        const origPdfUrl = `/api/harness/tenants/${encodeURIComponent(job.tenantId)}/jobs/${encodeURIComponent(job.jobId)}/slices/${focusedSeg.segmentIndex}/pdf`;
        if (!focusedSeg.wasTranslated) {
          const openLink = document.createElement('a');
          openLink.href = origPdfUrl;
          openLink.target = '_blank';
          openLink.className = 'ghost-action-btn';
          openLink.textContent = 'Open PDF ↗';
          sliceRow.appendChild(openLink);
        }
      }

      if (job.status === 'Queued' || job.status === 'Running') {
        body.innerHTML = `
          <div class="content-column" style="padding:36px 0;color:var(--text-secondary);font-size:14px;">
            Processing document through Agent Harness (${(job.executionTrace || []).length} steps completed)...
          </div>
        `;
        return;
      }

      if (job.status === 'Failed') {
        body.innerHTML = `
          <div class="content-column" style="padding:24px 0;color:var(--status-err);font-size:14px;">
            <strong>Processing failed:</strong> ${escapeHtml(job.errorMessage || 'Unknown error')}
          </div>
        `;
        return;
      }

      // 1. View Document Tab — Side-by-Side (Original PDF + Translated PDF) when translated, or single full-bleed PDF
      if (docResultTab === 'document') {
        if (segs.length === 0) {
          body.innerHTML = `<div class="content-column">No PDF available.</div>`;
          return;
        }
        const focusedSeg = (selectedSliceIndex >= 0 ? segs.find(s => s.segmentIndex === selectedSliceIndex) : segs[0]) || segs[0];
        const origPdfUrl = `/api/harness/tenants/${encodeURIComponent(job.tenantId)}/jobs/${encodeURIComponent(job.jobId)}/slices/${focusedSeg.segmentIndex}/pdf`;
        const transPdfUrl = `${origPdfUrl}?translated=true`;

        if (focusedSeg.wasTranslated) {
          const splitKey = `${job.jobId}:${focusedSeg.segmentIndex}:side-by-side`;
          const existingSplit = body.querySelector('.pdf-side-by-side');
          if (existingSplit && existingSplit.dataset.splitKey === splitKey) {
            return;
          }
          const srcLang = (focusedSeg.detectedLanguage || 'es').toUpperCase();
          const tgtLang = (focusedSeg.targetLanguage || 'en').toUpperCase();
          body.innerHTML = `
            <div class="pdf-side-by-side" data-split-key="${escapeHtml(splitKey)}">
              <div class="pdf-pane">
                <div class="pdf-pane-bar">
                  <span><strong>Original Document (${escapeHtml(srcLang)})</strong> · Pages ${focusedSeg.startPage}–${focusedSeg.endPage}</span>
                  <a href="${origPdfUrl}" target="_blank" class="text-link-btn">Open ↗</a>
                </div>
                <iframe class="pdf-full-frame" src="${origPdfUrl}" title="Original PDF Preview"></iframe>
              </div>
              <div class="pdf-pane">
                <div class="pdf-pane-bar">
                  <span><strong>Translated Document (${escapeHtml(tgtLang)})</strong> · Azure Document Translation</span>
                  <a href="${transPdfUrl}" target="_blank" class="text-link-btn">Open ↗</a>
                </div>
                <iframe class="pdf-full-frame" src="${transPdfUrl}" title="Translated PDF Preview"></iframe>
              </div>
            </div>
          `;
          return;
        }

        const existingIframe = body.querySelector('iframe.pdf-full-frame:not(.pdf-side-by-side iframe)');
        if (existingIframe && existingIframe.getAttribute('src') === origPdfUrl && !body.querySelector('.pdf-side-by-side')) {
          return;
        }
        body.innerHTML = `<iframe class="pdf-full-frame" src="${origPdfUrl}" title="PDF Preview"></iframe>`;
        return;
      }

      // 2. Insights Tab — Calm Editorial Prose, Zero Nested Boxes
      if (docResultTab === 'insights') {
        const distinctLangs = [...new Set(segs.map(s => (s.detectedLanguage || 'en').toUpperCase()))];
        const anyTranslated = segs.some(s => s.wasTranslated);

        const summaryLineHtml = `
          <div class="packet-summary-line">
            <span>${job.totalPages || 0} pages · ${segs.length} slice${segs.length === 1 ? '' : 's'} · ${escapeHtml(distinctLangs.join(', '))}${anyTranslated ? ' → EN translated' : ''} · ${totalEntitiesCount} entities extracted</span>
            <span>Harness v${job.appliedHarnessVersion || 1}</span>
          </div>
        `;

        const sectionsHtml = activeSegs.map(s => {
          const docName = s.identifiedDocumentName || s.documentTypeName || `Slice ${s.segmentIndex + 1}`;
          const prose = cleanInsightText(s.insightSummary) || 'No insight summary generated for this slice.';
          const langNote = s.wasTranslated
            ? ` · Translated ${(s.detectedLanguage || '').toUpperCase()} → ${(s.targetLanguage || 'en').toUpperCase()}`
            : '';

          return `
            <article class="slice-section">
              <div class="slice-section-head">
                <div>
                  <h3 class="slice-section-title">${escapeHtml(docName)}</h3>
                  <div class="slice-section-sub">Slice ${s.segmentIndex + 1} · Pages ${s.startPage}–${s.endPage}${escapeHtml(langNote)}</div>
                </div>
                <button type="button" class="text-link-btn" onclick="jumpToSlicePdf(${s.segmentIndex})">Pages ${s.startPage}–${s.endPage} ↗</button>
              </div>
              <p class="insight-prose">${escapeHtml(prose)}</p>
              <details>
                <summary style="cursor:pointer;font-size:12.5px;color:var(--text-secondary);user-select:none;">Source text (${(s.translatedText || s.bodyText || '').length.toLocaleString()} chars)</summary>
                <pre style="background:#fafaf8;padding:14px;border-radius:8px;border:1px solid var(--line);font-size:12px;line-height:1.55;white-space:pre-wrap;margin-top:8px;max-height:220px;overflow:auto;">${escapeHtml(s.translatedText || s.bodyText)}</pre>
              </details>
            </article>
          `;
        }).join('');

        body.innerHTML = `<div class="content-column">${summaryLineHtml}<div class="slices-wide-grid">${sectionsHtml}</div></div>`;
        return;
      }

      // 3. Entities Tab — Clean Scannable Table + Project Meridian Filter Pills
      if (docResultTab === 'entities') {
        const allEntities = activeSegs.flatMap(s => (s.extractedEntities || []).map(e => ({
          ...e,
          sliceIndex: s.segmentIndex,
          sliceNum: s.segmentIndex + 1,
          pageRange: `${s.startPage}–${s.endPage}`,
          docType: s.identifiedDocumentName || s.documentTypeName
        })));

        if (allEntities.length === 0) {
          body.innerHTML = `<div class="content-column" style="color:var(--text-secondary);font-size:14px;">No extracted entities for this selection.</div>`;
          return;
        }

        const categories = ['ALL', ...new Set(allEntities.map(e => (e.category || 'Entity').toUpperCase()))];
        if (!categories.includes(selectedEntityCategory)) selectedEntityCategory = 'ALL';
        const filteredEntities = selectedEntityCategory === 'ALL'
          ? allEntities
          : allEntities.filter(e => (e.category || 'Entity').toUpperCase() === selectedEntityCategory);

        body.innerHTML = `
          <div class="content-column">
            <div class="filter-pill-bar">
              ${categories.map(cat => `
                <button type="button" class="filter-pill-btn ${selectedEntityCategory === cat ? 'active' : ''}" onclick="setEntityCategoryFilter('${escapeHtml(cat)}')">
                  ${cat === 'ALL' ? `All (${allEntities.length})` : escapeHtml(cat.charAt(0) + cat.slice(1).toLowerCase())}
                </button>
              `).join('')}
            </div>

            <table class="clean-table">
              <thead>
                <tr>
                  <th>Entity</th>
                  <th>Value</th>
                  <th>Category</th>
                  <th>Source</th>
                  <th>Confidence</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${filteredEntities.map(e => {
                  const pct = Math.round((e.confidence <= 1 ? e.confidence * 100 : e.confidence));
                  return `
                    <tr>
                      <td style="color:var(--text-secondary);">${escapeHtml(e.name)}</td>
                      <td style="font-weight:600;color:var(--text-primary);">${escapeHtml(e.value)}</td>
                      <td style="color:var(--text-secondary);font-size:12.5px;">${escapeHtml(e.category || 'Entity')}</td>
                      <td><button type="button" class="text-link-btn" onclick="jumpToSlicePdf(${e.sliceIndex})">Slice ${e.sliceNum} (p.${escapeHtml(e.pageRange)}) ↗</button></td>
                      <td style="color:var(--text-secondary);font-size:12.5px;">${pct}%</td>
                      <td style="text-align:right;"><button type="button" class="text-link-btn" onclick="copyTextValue(${JSON.stringify(String(e.value || '')).replace(/"/g, '&quot;')})">Copy</button></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
        return;
      }

      // 3b. Document Graph by Entities Tab — Interactive Entity-Filtered Knowledge Graph
      if (docResultTab === 'graph') {
        renderDocumentGraphTab(body, job);
        return;
      }

      // 4. Structured Data Tab — Clean Definition List + Tables
      if (docResultTab === 'structured') {
        const slicesWithData = activeSegs.filter(s => s.dataExtraction && ((s.dataExtraction.fields && s.dataExtraction.fields.length > 0) || (s.dataExtraction.tables && s.dataExtraction.tables.length > 0)));
        if (slicesWithData.length === 0) {
          body.innerHTML = `
            <div class="content-column" style="color:var(--text-secondary);font-size:14px;">
              No structured key-value fields or tables configured for this document type. Configure schemas in <a href="/admin.html" style="color:var(--text-primary);">Admin Studio ↗</a>.
            </div>
          `;
          return;
        }

        body.innerHTML = `<div class="content-column">` + slicesWithData.map(s => {
          const de = s.dataExtraction;
          const fieldsHtml = (de.fields && de.fields.length > 0) ? `
            <dl class="kv-grid">
              ${de.fields.map(f => `
                <div class="kv-item">
                  <dt>${escapeHtml(f.fieldName)} <span style="color:var(--text-muted);">(${Math.round(f.confidenceValue)}%)</span></dt>
                  <dd>${escapeHtml(f.fieldValue || '—')}</dd>
                </div>
              `).join('')}
            </dl>
          ` : '';

          const tablesHtml = (de.tables || []).map(t => {
            const rows = t.rows || [];
            const colNames = rows.length > 0 ? (rows[0].fields || []).map(c => c.fieldName) : [];
            return `
              <div style="margin-top:16px;overflow-x:auto;">
                <div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">${escapeHtml(t.tableName)}</div>
                ${rows.length > 0 ? `
                  <table class="clean-table">
                    <thead>
                      <tr>${colNames.map(cn => `<th>${escapeHtml(cn)}</th>`).join('')}</tr>
                    </thead>
                    <tbody>
                      ${rows.map(r => `
                        <tr>${(r.fields || []).map(cell => `<td>${escapeHtml(cell.fieldValue)}</td>`).join('')}</tr>
                      `).join('')}
                    </tbody>
                  </table>
                ` : '<div style="font-size:12.5px;color:var(--text-muted);">No rows matched in this slice.</div>'}
              </div>
            `;
          }).join('');

          return `
            <section class="slice-section">
              <div class="slice-section-head">
                <div>
                  <h3 class="slice-section-title">${escapeHtml(de.documentName)}</h3>
                  <div class="slice-section-sub">Slice ${s.segmentIndex + 1} · Pages ${escapeHtml(de.pageRange)}</div>
                </div>
                <button type="button" class="text-link-btn" onclick="jumpToSlicePdf(${s.segmentIndex})">View PDF ↗</button>
              </div>
              ${fieldsHtml}
              ${tablesHtml}
            </section>
          `;
        }).join('') + `</div>`;
        return;
      }

      // 5. Individual Prompt Column Tab (`prompt:<columnId>`) — Clean Outcome Only
      if (docResultTab.startsWith('prompt:')) {
        const targetColumnId = docResultTab.substring('prompt:'.length);
        const matchingSliceEntries = activeSegs.map(s => {
          const sliceResults = (s.promptColumnResults && s.promptColumnResults.length > 0)
            ? s.promptColumnResults
            : (job.promptColumnResults || []).filter(r => r.segmentIndex === s.segmentIndex);
          const colResult = sliceResults.find(r => r.columnId === targetColumnId && r.filterMatched);
          return colResult ? { slice: s, result: colResult } : null;
        }).filter(Boolean);

        const sliceCardsHtml = matchingSliceEntries.map(({ slice, result }) => {
          const docName = slice.identifiedDocumentName || slice.documentTypeName || `Slice ${slice.segmentIndex + 1}`;
          const cleanedOutcome = String(result.resultText || '')
            .replace(/^Summary\s*\([^)]*\):\s*/i, '')
            .replace(/^(?:Summarize the contents of|Extract the most important[^'\n]*from|Verify contract identifiers[^'\n]*in)\s+/i, '')
            .replace(/\s*in a clear and concise manner\.?\s*Focus on key points, main arguments, and important conclusions\.?/gi, '')
            .replace(/\s*as concise bullet points\.?/gi, '')
            .trim();

          return `
            <article class="slice-section">
              <div class="slice-section-head">
                <div>
                  <h3 class="slice-section-title">${escapeHtml(docName)}</h3>
                  <div class="slice-section-sub">Pages ${slice.startPage}–${slice.endPage}</div>
                </div>
              </div>
              <p class="insight-prose">${escapeHtml(cleanedOutcome)}</p>
            </article>
          `;
        }).join('');

        body.innerHTML = `<div class="content-column"><div class="slices-wide-grid">${sliceCardsHtml}</div></div>`;
        return;
      }

      // 6. Metadata Tab — Clean Provenance Table + Collapsible Engineering Trace
      if (docResultTab === 'metadata') {
        const trace = job.executionTrace || [];
        body.innerHTML = `
          <div class="content-column">
            <dl class="kv-grid" style="padding-bottom:20px;border-bottom:1px solid var(--line);">
              <div class="kv-item"><dt>Job ID</dt><dd style="font-family:monospace;font-size:12.5px;">${escapeHtml(job.jobId)}</dd></div>
              <div class="kv-item"><dt>Tenant</dt><dd>${escapeHtml(job.tenantId)}</dd></div>
              <div class="kv-item"><dt>Harness Version</dt><dd>v${job.appliedHarnessVersion || 1}</dd></div>
              <div class="kv-item"><dt>Language Model</dt><dd>${escapeHtml(job.modelIdUsed || 'gpt-5-mini')}</dd></div>
            </dl>

            <h3 class="slice-section-title" style="margin:24px 0 12px 0;">Document Slices</h3>
            <table class="clean-table" style="margin-bottom:28px;">
              <thead>
                <tr><th>Slice</th><th>Pages</th><th>Identified Document</th><th>Matched Rule</th><th>Footer Signature</th><th>PDF</th></tr>
              </thead>
              <tbody>
                ${activeSegs.map(s => `
                  <tr>
                    <td>#${s.segmentIndex + 1}</td>
                    <td>${s.startPage}–${s.endPage}</td>
                    <td style="font-weight:600;">${escapeHtml(s.identifiedDocumentName || s.documentTypeName || 'Undefined')}</td>
                    <td style="color:var(--text-secondary);font-size:12.5px;">${escapeHtml(s.matchedIdentificationRule || '—')}</td>
                    <td style="font-family:monospace;font-size:12px;color:var(--text-secondary);">${escapeHtml((s.footers || []).join(', ') || '—')}</td>
                    <td><a href="/api/harness/tenants/${encodeURIComponent(job.tenantId)}/jobs/${encodeURIComponent(job.jobId)}/slices/${s.segmentIndex}/pdf" target="_blank" class="text-link-btn">Open ↗</a></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>

            <details>
              <summary style="cursor:pointer;font-size:13px;font-weight:600;color:var(--text-secondary);user-select:none;">Pipeline Execution Trace (${trace.length} steps)</summary>
              <table class="clean-table" style="margin-top:12px;">
                <thead>
                  <tr><th>Executor Step</th><th>Status</th><th>Model / Service</th><th>Duration</th><th>Notes</th></tr>
                </thead>
                <tbody>
                  ${trace.map(t => `
                    <tr>
                      <td style="font-weight:500;">${escapeHtml(t.executorName)}</td>
                      <td>${t.executed ? 'Executed' : 'Skipped'}</td>
                      <td style="color:var(--text-secondary);">${escapeHtml(t.modelIdUsed || 'Deterministic')}</td>
                      <td style="font-family:monospace;font-size:12px;">${t.durationMs ? t.durationMs.toFixed(1) + ' ms' : '0 ms'}</td>
                      <td style="color:var(--text-secondary);font-size:12.5px;">${escapeHtml(t.notes || '')}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </details>
          </div>
        `;
      }
    }

    function computeFilteredGraphData() {
      const completedJobs = (graphScope === 'CURRENT_DOC' && selectedJobId)
        ? tenantJobs.filter(j => j.jobId === selectedJobId)
        : tenantJobs.filter(j => j.status === 'Completed');

      const allEntityNamesMap = new Map();
      const allEntityValuePairsMap = new Map();

      completedJobs.forEach(j => {
        const segs = (j.jobId === selectedJobId && selectedSliceIndex !== -1)
          ? (j.segments || []).filter(s => s.segmentIndex === selectedSliceIndex)
          : (j.segments || []);
        segs.forEach(s => {
          (s.extractedEntities || []).forEach(e => {
            if (!e || !e.name || !e.value) return;
            const eName = e.name.trim();
            const eVal = e.value.trim();
            allEntityNamesMap.set(eName, (allEntityNamesMap.get(eName) || 0) + 1);
            const pairKey = `${eName}||${eVal}`;
            if (!allEntityValuePairsMap.has(pairKey)) {
              allEntityValuePairsMap.set(pairKey, { name: eName, value: eVal, category: e.category || 'Entity', count: 0 });
            }
            allEntityValuePairsMap.get(pairKey).count++;
          });
        });
      });

      const docNodes = [];
      const entityNodesMap = new Map();
      const edges = [];
      const q = (graphEntitySearchQuery || '').trim().toLowerCase();

      completedJobs.forEach(j => {
        const segs = (j.jobId === selectedJobId && selectedSliceIndex !== -1)
          ? (j.segments || []).filter(s => s.segmentIndex === selectedSliceIndex)
          : (j.segments || []);

        segs.forEach(s => {
          const docNodeId = `doc:${j.jobId}:${s.segmentIndex}`;
          const docLabel = s.identifiedDocumentName || s.documentTypeName || `Slice ${s.segmentIndex + 1}`;
          const matchingEntitiesForSlice = [];

          (s.extractedEntities || []).forEach(e => {
            if (!e || !e.name || !e.value) return;
            const eName = e.name.trim();
            const eVal = e.value.trim();
            const pairKey = `${eName}||${eVal}`;

            if (graphSelectedEntityNames.size > 0 && !graphSelectedEntityNames.has(eName)) {
              return;
            }
            if (graphSelectedEntityValuePair !== 'ALL' && graphSelectedEntityValuePair !== pairKey) {
              return;
            }
            if (q && !`${eName} ${eVal} ${docLabel} ${j.fileName}`.toLowerCase().includes(q)) {
              return;
            }

            const entNodeId = `ent:${pairKey}`;
            if (!entityNodesMap.has(entNodeId)) {
              entityNodesMap.set(entNodeId, {
                id: entNodeId,
                type: 'entity',
                pairKey,
                entityName: eName,
                entityValue: eVal,
                category: (e.category || 'Entity').toUpperCase(),
                connectedDocs: []
              });
            }

            matchingEntitiesForSlice.push(entNodeId);
          });

          const uniqEntIds = [...new Set(matchingEntitiesForSlice)];
          if (uniqEntIds.length > 0) {
            const docNode = {
              id: docNodeId,
              type: 'doc',
              jobId: j.jobId,
              fileName: (j.fileName || 'Document').replace(/\.pdf$/i, ''),
              sliceIndex: s.segmentIndex,
              docName: docLabel,
              pageRange: `p.${s.startPage}–${s.endPage}`,
              entityIds: uniqEntIds,
              isCurrentJob: j.jobId === selectedJobId
            };
            docNodes.push(docNode);

            uniqEntIds.forEach(entNodeId => {
              edges.push({ source: docNodeId, target: entNodeId });
              const entNode = entityNodesMap.get(entNodeId);
              if (entNode) {
                entNode.connectedDocs.push(docNode);
              }
            });
          }
        });
      });

      return {
        allEntityNames: [...allEntityNamesMap.entries()].map(([name, count]) => ({ name, count })),
        allEntityValuePairs: [...allEntityValuePairsMap.entries()].map(([pairKey, info]) => ({ pairKey, ...info })),
        docNodes,
        entityNodes: [...entityNodesMap.values()],
        edges
      };
    }

    function getEntityCategoryColor(cat) {
      const c = String(cat || '').toUpperCase();
      if (c.includes('IDENTIFIER')) return { bg: '#eef0ff', border: '#4b72fe', text: '#2842b5', dot: '#4b72fe' };
      if (c.includes('PARTY') || c.includes('CUSTOMER')) return { bg: '#ecfdf5', border: '#0d9488', text: '#0f766e', dot: '#0d9488' };
      if (c.includes('FINANCIAL')) return { bg: '#fffbeb', border: '#d97706', text: '#b45309', dot: '#d97706' };
      return { bg: '#f5f3ff', border: '#7c3aed', text: '#6d28d9', dot: '#7c3aed' };
    }

    function renderDocumentGraphTab(body) {
      const data = computeFilteredGraphData();
      const hasActiveFilters = graphSelectedEntityNames.size > 0 || graphSelectedEntityValuePair !== 'ALL' || (graphEntitySearchQuery || '').trim().length > 0;

      body.innerHTML = `
        <div class="graph-shell">
          <div class="graph-filter-bar">
            <div class="graph-filter-top">
              <div class="graph-controls-group">
                <span style="font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-secondary);">Scope:</span>
                <button type="button" class="filter-pill-btn ${graphScope === 'ALL_DOCS' ? 'active' : ''}" onclick="setGraphScope('ALL_DOCS')">All Tenant Documents</button>
                <button type="button" class="filter-pill-btn ${graphScope === 'CURRENT_DOC' ? 'active' : ''}" onclick="setGraphScope('CURRENT_DOC')">Current Document</button>
              </div>

              <div class="graph-controls-group">
                <select class="graph-select" id="graphEntityValueSelect" onchange="onGraphEntityValueFilterChanged(this.value)" title="Filter graph by a specific Entity Name & Value">
                  <option value="ALL">All Entity Values (${data.allEntityValuePairs.length})</option>
                  ${data.allEntityValuePairs.map(p => `
                    <option value="${escapeHtml(p.pairKey)}" ${graphSelectedEntityValuePair === p.pairKey ? 'selected' : ''}>
                      ${escapeHtml(p.name)}: ${escapeHtml(p.value)} (${p.count})
                    </option>
                  `).join('')}
                </select>
                <input type="text" class="graph-input" id="graphEntitySearchInput" placeholder="Filter by entity or document..." value="${escapeHtml(graphEntitySearchQuery)}" oninput="onGraphSearchInputChanged(this.value)" style="width:210px;" />
                ${hasActiveFilters ? `<button type="button" class="ghost-action-btn" onclick="resetGraphFilters()">✕ Clear Filters</button>` : ''}
              </div>
            </div>

            <div class="filter-pill-bar" style="margin-bottom:0;">
              <span style="font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;color:var(--text-secondary);margin-right:4px;">Entity Filter:</span>
              <button type="button" class="filter-pill-btn ${graphSelectedEntityNames.size === 0 ? 'active' : ''}" onclick="toggleGraphEntityNameFilter('ALL')">
                All Entities
              </button>
              ${data.allEntityNames.map(en => `
                <button type="button" class="filter-pill-btn ${graphSelectedEntityNames.has(en.name) ? 'active' : ''}" onclick="toggleGraphEntityNameFilter(${JSON.stringify(en.name).replace(/"/g, '&quot;')})">
                  ${escapeHtml(en.name)} <span style="opacity:0.65;font-family:var(--font-mono);font-size:11px;">${en.count}</span>
                </button>
              `).join('')}
            </div>
          </div>

          <div class="graph-workbench" id="graphWorkbenchContainer"></div>
        </div>
      `;

      renderDocumentGraphCanvasOnly();
    }

    function renderDocumentGraphCanvasOnly() {
      const container = document.getElementById('graphWorkbenchContainer');
      if (!container) return;

      const data = computeFilteredGraphData();
      const { docNodes, entityNodes, edges } = data;

      const width = 920;
      const height = Math.max(500, Math.max(docNodes.length * 95, entityNodes.length * 76) + 80);

      // Compute clean deterministic bipartite / radial coordinates with drag overrides
      const nodeById = new Map();
      const docX = 215;
      const entX = 685;

      docNodes.forEach((d, idx) => {
        const defaultY = ((idx + 1) / (docNodes.length + 1)) * height;
        const pos = graphCustomNodePositions[d.id] || { x: docX, y: defaultY };
        d.x = pos.x;
        d.y = pos.y;
        nodeById.set(d.id, d);
      });

      entityNodes.forEach((e, idx) => {
        const defaultY = ((idx + 1) / (entityNodes.length + 1)) * height;
        const pos = graphCustomNodePositions[e.id] || { x: entX, y: defaultY };
        e.x = pos.x;
        e.y = pos.y;
        nodeById.set(e.id, e);
      });

      const activeNeighborIds = new Set();
      if (graphFocusedNodeId && nodeById.has(graphFocusedNodeId)) {
        activeNeighborIds.add(graphFocusedNodeId);
        edges.forEach(ed => {
          if (ed.source === graphFocusedNodeId) activeNeighborIds.add(ed.target);
          if (ed.target === graphFocusedNodeId) activeNeighborIds.add(ed.source);
        });
      }

      const edgesSvg = edges.map(ed => {
        const src = nodeById.get(ed.source);
        const tgt = nodeById.get(ed.target);
        if (!src || !tgt) return '';
        const x1 = src.x + 125;
        const y1 = src.y;
        const x2 = tgt.x - 130;
        const y2 = tgt.y;
        const midX = (x1 + x2) / 2;
        const isHighlighted = !graphFocusedNodeId || (ed.source === graphFocusedNodeId || ed.target === graphFocusedNodeId);
        const strokeColor = isHighlighted ? '#4b72fe' : '#dcd9e8';
        const strokeWidth = isHighlighted && graphFocusedNodeId ? '2.4' : '1.6';
        const opacity = isHighlighted ? '0.88' : '0.25';
        return `<path d="M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}" fill="none" stroke="${strokeColor}" stroke-width="${strokeWidth}" stroke-opacity="${opacity}" />`;
      }).join('');

      const docNodesSvg = docNodes.map(d => {
        const dimmed = graphFocusedNodeId && !activeNeighborIds.has(d.id);
        const isFocused = graphFocusedNodeId === d.id;
        const borderCol = isFocused ? '#4b72fe' : (d.isCurrentJob ? '#16161d' : '#c9c5dc');
        const strokeW = isFocused ? '2.4' : '1.5';
        const titleShort = d.docName.length > 26 ? d.docName.slice(0, 25) + '…' : d.docName;
        const subShort = `${d.fileName.slice(0, 18)} · Slice ${d.sliceIndex + 1} (${d.pageRange})`;

        return `
          <g class="graph-node" data-node-id="${escapeHtml(d.id)}" transform="translate(${d.x}, ${d.y})" style="opacity:${dimmed ? '0.28' : '1'};cursor:pointer;" onclick="focusGraphNode('${escapeHtml(d.id)}')">
            <rect x="-125" y="-28" width="250" height="56" rx="10" fill="#ffffff" stroke="${borderCol}" stroke-width="${strokeW}" />
            <rect x="-125" y="-28" width="6" height="56" rx="3" fill="${isFocused ? '#4b72fe' : '#16161d'}" />
            <text x="-106" y="-5" font-family="Overused Grotesk, sans-serif" font-size="13" font-weight="600" fill="#16161d">${escapeHtml(titleShort)}</text>
            <text x="-106" y="14" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#5d6074">${escapeHtml(subShort)}</text>
            <circle cx="105" cy="0" r="11" fill="#eef0ff" stroke="#b9c3ff" stroke-width="1" />
            <text x="105" y="3.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10.5" font-weight="600" fill="#2842b5">${d.entityIds.length}</text>
          </g>
        `;
      }).join('');

      const entityNodesSvg = entityNodes.map(e => {
        const dimmed = graphFocusedNodeId && !activeNeighborIds.has(e.id);
        const isFocused = graphFocusedNodeId === e.id;
        const colors = getEntityCategoryColor(e.category);
        const valShort = e.entityValue.length > 26 ? e.entityValue.slice(0, 25) + '…' : e.entityValue;
        const nameUpper = e.entityName.toUpperCase();

        return `
          <g class="graph-node" data-node-id="${escapeHtml(e.id)}" transform="translate(${e.x}, ${e.y})" style="opacity:${dimmed ? '0.28' : '1'};cursor:pointer;" onclick="focusGraphNode('${escapeHtml(e.id)}')">
            <rect x="-130" y="-26" width="260" height="52" rx="26" fill="${colors.bg}" stroke="${colors.border}" stroke-width="${isFocused ? '2.6' : '1.5'}" />
            <circle cx="-104" cy="0" r="10" fill="${colors.dot}" />
            <text x="-104" y="3.5" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" fill="#ffffff">${e.connectedDocs.length}</text>
            <text x="-84" y="-4" font-family="IBM Plex Mono, monospace" font-size="10" font-weight="600" letter-spacing="0.04em" fill="${colors.text}">${escapeHtml(nameUpper)}</text>
            <text x="-84" y="13" font-family="Overused Grotesk, sans-serif" font-size="13" font-weight="600" fill="#16161d">${escapeHtml(valShort)}</text>
          </g>
        `;
      }).join('');

      let inspectorHtml = '';
      const focusedNode = graphFocusedNodeId ? nodeById.get(graphFocusedNodeId) : null;

      if (focusedNode && focusedNode.type === 'entity') {
        inspectorHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent-ink);text-transform:uppercase;">Entity Node Selected</span>
            <button type="button" class="text-link-btn" onclick="focusGraphNode(null)">Show All</button>
          </div>
          <div>
            <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);text-transform:uppercase;">${escapeHtml(focusedNode.entityName)}</div>
            <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-top:2px;">${escapeHtml(focusedNode.entityValue)}</div>
          </div>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);text-transform:uppercase;margin-top:4px;">
            Connected Documents (${focusedNode.connectedDocs.length})
          </div>
          ${focusedNode.connectedDocs.map(d => `
            <div class="graph-inspector-item" onclick="jumpFromGraphToSlice('${escapeHtml(d.jobId)}', ${d.sliceIndex})">
              <div style="font-weight:600;font-size:13.5px;color:var(--text-primary);">${escapeHtml(d.docName)}</div>
              <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);">${escapeHtml(d.fileName)} · Slice ${d.sliceIndex + 1} (${escapeHtml(d.pageRange)})</div>
              <div style="font-family:var(--font-mono);font-size:11px;color:var(--accent);margin-top:2px;">Open Document PDF ↗</div>
            </div>
          `).join('')}
        `;
      } else if (focusedNode && focusedNode.type === 'doc') {
        const connectedEntities = focusedNode.entityIds.map(id => nodeById.get(id)).filter(Boolean);
        inspectorHtml = `
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span style="font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent-ink);text-transform:uppercase;">Document Slice Selected</span>
            <button type="button" class="text-link-btn" onclick="focusGraphNode(null)">Show All</button>
          </div>
          <div>
            <div style="font-size:16px;font-weight:600;color:var(--text-primary);">${escapeHtml(focusedNode.docName)}</div>
            <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);margin-top:2px;">${escapeHtml(focusedNode.fileName)} · Slice ${focusedNode.sliceIndex + 1} (${escapeHtml(focusedNode.pageRange)})</div>
          </div>
          <button type="button" class="text-link-btn" style="width:fit-content;" onclick="jumpFromGraphToSlice('${escapeHtml(focusedNode.jobId)}', ${focusedNode.sliceIndex})">Open PDF Viewer ↗</button>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);text-transform:uppercase;margin-top:4px;">
            Extracted Entities (${connectedEntities.length})
          </div>
          ${connectedEntities.map(e => `
