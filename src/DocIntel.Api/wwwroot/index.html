<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocIntel — Document Intelligence</title>
  <link rel="preconnect" href="https://fonts.cdnfonts.com" />
  <link href="https://fonts.cdnfonts.com/css/overused-grotesk" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --header-surface: #f6f6f8;
      --drawer-surface: #f6f6f8;
      --canvas-bg: #ffffff;
      --surface-soft: #f0f0f5;
      --line: #e3e1ec;
      --line-subtle: #ebe9f2;
      --text-primary: #16161d;
      --text-body: #2c2e3c;
      --text-secondary: #5d6074;
      --text-muted: #8f92a6;
      --monogram-bg: #16161d;
      --accent: #3d56e0;
      --accent-mid: #4b72fe;
      --accent-soft: #eef0ff;
      --accent-border: #b5bcf3;
      --accent-ink: #3945a8;
      --status-ok: #138fa6;
      --status-run: #4b72fe;
      --status-err: #c43d4b;
      --font-sans: "Overused Grotesk", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-serif: "Overused Grotesk", system-ui, -apple-system, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      background: var(--canvas-bg);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* =========================================================================
       Single Collapsible Left Document Drawer (280px <-> 0px)
       ========================================================================= */
    .doc-drawer {
      width: 280px;
      background: var(--drawer-surface);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.16s ease;
      overflow: hidden;
      user-select: none;
    }

    .doc-drawer.collapsed {
      width: 0;
      border-right: 0;
      opacity: 0;
      pointer-events: none;
    }

    .drawer-top {
      padding: 16px 14px 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .drawer-brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tenant-switcher-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }

    .tenant-mini-monogram {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--monogram-bg);
      color: #ffffff;
      font-family: var(--font-mono);
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .tenant-mini-monogram::after,
    .meridian-monogram::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2.5px;
      background: linear-gradient(90deg, #37d7fa 0%, #4b72fe 40%, #ff8df2 75%, #ff8705 100%);
    }

    .tenant-select {
      flex: 1;
      min-width: 0;
      border: 1px solid transparent;
      background: transparent;
      font-family: var(--font-sans);
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      padding: 4px 6px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      text-overflow: ellipsis;
    }

    .tenant-select:hover {
      background: #efeee9;
    }

    .icon-toggle-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .icon-toggle-btn:hover {
      background: #eae9e4;
      color: var(--text-primary);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 10px;
      width: 13.5px;
      height: 13.5px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      padding: 7px 10px 7px 30px;
      border: 1px solid #e4e3dd;
      border-radius: 8px;
      font-size: 12.5px;
      font-family: inherit;
      background: #ffffff;
      color: var(--text-primary);
      transition: border-color 0.15s ease;
    }

    .search-box input:focus {
      outline: none;
      border-color: #b5b3ac;
    }

    .drawer-subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 4px 14px;
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .ghost-action-btn {
      height: 28px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text-primary);
      border-radius: 7px;
      padding: 0 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: all 0.14s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 1px 2px rgba(22, 22, 29, 0.04);
    }

    .ghost-action-btn:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent-ink);
    }

    .doc-items-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 14px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .doc-row {
      padding: 9px 11px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: background 0.12s ease;
    }

    .doc-row:hover {
      background: var(--surface-soft);
    }

    .doc-row.selected {
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(22, 22, 29, 0.05), 0 0 0 1px var(--line);
    }

    .doc-row-main {
      flex: 1;
      min-width: 0;
    }

    .doc-row-name {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: -0.005em;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }

    .doc-row.selected .doc-row-name {
      font-weight: 600;
      color: var(--accent-ink);
    }

    .doc-row-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: var(--status-ok);
      flex-shrink: 0;
    }

    .status-dot.running {
      background: var(--status-run);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.18);
    }

    .status-dot.failed {
      background: var(--status-err);
    }

    .drawer-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-upload-primary {
      width: 100%;
      background: var(--monogram-bg);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 8.5px 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: background 0.15s ease;
    }

    .btn-upload-primary:hover {
      background: #1f2326;
    }

    .admin-switch-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 4px 2px;
      transition: color 0.12s ease;
    }

    .admin-switch-link:hover {
      color: var(--text-primary);
    }

    /* =========================================================================
       Main Workspace — "Project Meridian" Header & Floating White-Pill Tabs
       ========================================================================= */
    .workspace-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--canvas-bg);
    }

    .meridian-header {
      background: var(--header-surface);
      border-bottom: 1px solid var(--line);
      padding: 22px 28px 12px 28px;
      flex-shrink: 0;
    }

    .meridian-top-row {
      height: 30px;
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .meridian-identity {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
    }

    .meridian-monogram {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--monogram-bg);
      color: #ffffff;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      align-self: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 1px 3px rgba(22, 22, 29, 0.12);
    }

    .meridian-title {
      font-family: var(--font-sans);
      font-size: 21px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
      letter-spacing: -0.025em;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .meridian-folder-meta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .meridian-folder-meta svg {
      width: 13.5px;
      height: 13.5px;
      color: var(--text-muted);
    }

    .meridian-actions {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .meridian-nav-row {
      height: 32px;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: nowrap;
    }

    .meridian-tabs {
      height: 32px;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: nowrap;
      min-width: 0;
      background: transparent;
      border: none;
      padding: 0;
      box-shadow: none;
    }

    .meridian-tab {
      height: 32px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      padding: 0 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.14s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .meridian-tab:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.55);
    }

    .meridian-tab.active {
      background: #ffffff;
      border: none;
      color: var(--text-primary);
      font-weight: 600;
      box-shadow: 0 1px 3px rgba(22, 22, 29, 0.06);
    }

    .tab-count {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .meridian-tab.active .tab-count {
      color: var(--text-secondary);
    }

    .meridian-slice-select {
      height: 28px;
      border: 1px solid #dfddd6;
      background: #ffffff;
      border-radius: 6px;
      padding: 0 8px;
      font-size: 11.5px;
      line-height: 1;
      font-weight: 500;
      color: var(--text-secondary);
      font-family: inherit;
      cursor: pointer;
      width: 116px;
      text-overflow: ellipsis;
      outline: none;
    }

    .meridian-slice-select:hover {
      border-color: #c5c3ba;
    }

    /* =========================================================================
       Main Content Area (Calm, Borderless Editorial Sections)
       ========================================================================= */
    .workspace-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 28px 36px 40px 36px;
    }

    .workspace-body[data-tab="document"] {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .pdf-full-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f3f3f2;
      display: block;
    }

    .pdf-side-by-side {
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--line);
      gap: 1px;
    }

    .pdf-pane {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      height: 100%;
      background: #ffffff;
    }

    .pdf-pane-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 14px;
      background: var(--header-surface);
      border-bottom: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .pdf-pane-bar strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .content-column {
      width: 100%;
      max-width: 100%;
    }

    .slices-wide-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .packet-summary-line {
      margin: 0 0 24px 0;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .slice-section {
      padding: 18px 20px;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(22, 22, 29, 0.04);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .slice-section:hover {
      border-color: #c9c5dc;
      box-shadow: 0 4px 18px rgba(22, 22, 29, 0.06);
    }

    .slice-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
      user-select: none;
    }

    .slice-card-body {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .slice-section.expanded .slice-card-body {
      display: block;
    }

    .slice-chevron-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.16s ease, background 0.12s ease, color 0.12s ease;
    }

    .slice-chevron-btn:hover {
      background: var(--header-surface);
      color: var(--text-primary);
    }

    .slice-section.expanded .slice-chevron-btn {
      transform: rotate(180deg);
      color: var(--text-primary);
    }

    .slice-section-title {
      font-family: var(--font-sans);
      font-size: 16.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      margin: 0;
    }

    .slice-section-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .text-link-btn {
      background: var(--header-surface);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: all 0.14s ease;
    }

    .text-link-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-ink);
    }

    .insight-prose {
      font-size: 14px;
      line-height: 1.62;
      color: var(--text-body);
      max-width: 100%;
      margin: 0 0 12px 0;
      white-space: pre-wrap;
    }

    /* Filter pills in ExtractBench Pro .xp-chip style */
    .filter-pill-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-pill-btn {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .filter-pill-btn:hover {
      border-color: #c9c5dc;
    }

    .filter-pill-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent-border);
      color: var(--accent-ink);
      font-weight: 600;
    }

    /* Clean Tables with IBM Plex Mono headers */
    .clean-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }

    .clean-table th,
    .clean-table td {
      text-align: left;
      padding: 11px 14px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .clean-table th {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--line);
    }

    .clean-table tbody tr:hover td {
      background: var(--header-surface);
    }

    .kv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px 28px;
      margin: 0 0 24px 0;
    }

    .kv-item dt {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .kv-item dd {
      margin: 0;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--text-primary);
      word-break: break-word;
    }

    /* Document Graph by Entities View */
    .workspace-body[data-tab="graph"] {
      padding: 18px 28px 24px 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .graph-shell {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
      min-height: 0;
    }

    .graph-filter-bar {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .graph-filter-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .graph-controls-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .graph-input,
    .graph-select {
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 7px;
      outline: none;
    }

    .graph-input:focus,
    .graph-select:focus {
      border-color: var(--accent);
      background: #ffffff;
    }

    /* Unified Multi-Select Entity & Value Combobox */
    .entity-multiselect-wrap {
      position: relative;
      width: 100%;
    }

    .entity-multiselect-box {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px 10px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }

    .entity-multiselect-box:hover,
    .entity-multiselect-box.open {
      border-color: var(--accent-border);
      box-shadow: 0 2px 10px rgba(75, 114, 254, 0.07);
    }

      line-height: 1;

    .entity-multiselect-popover {

      right: 0;

      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      z-index: 120;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

      display: flex;
    }

    .entity-popover-search {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fafafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .entity-popover-search input {
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 10px;
      font-family: var(--font-sans);
      font-size: 12.5px;
      outline: none;
    }

    .entity-popover-list {
      overflow-y: auto;
      padding: 8px 12px 12px 12px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px;
    }

    .entity-group-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .entity-group-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 6px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-primary);
      background: #f5f5fa;
      cursor: pointer;
    }

    .entity-value-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 12.5px;
      color: var(--text-body);
      cursor: pointer;
      transition: background 0.1s ease;
    }

    .entity-value-option:hover {
      background: #f2f3f9;
    }

    .entity-value-option.checked {
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-weight: 600;
    }

    .graph-workbench {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 14px;
    }

    @media (max-width: 1024px) {
      .graph-workbench {
        grid-template-columns: 1fr;
      }
    }

    .graph-info-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      flex-shrink: 0;
    }

    @media (max-width: 1100px) {
      .graph-info-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .graph-info-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .graph-info-label {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .graph-info-value {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .graph-info-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .graph-canvas-card {
      background: #fbfbfc;
      border: 1px solid var(--line);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }

    .graph-svg {
      width: 100%;
      height: 100%;
      flex: 1;
      cursor: grab;
      user-select: none;
    }

    .graph-svg:active {
      cursor: grabbing;
    }

    .graph-floating-hud {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .graph-legend,
    .graph-zoom-bar {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(6px);

      align-items: center;

    .graph-inspector-card {

      border: 1px solid var(--line);

      flex-direction: column;

    .graph-inspector-item {

    /* Tenant-Level View Switcher (Documents vs Cross-Document Graph vs Ask AI) */
    .workspace-mode-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;

      color: var(--text-primary);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(22, 22, 29, 0.08);

    /* Self-Contained Copilot Ask AI Layout WITHIN Ask AI View (Aligned 1:1 with Left Panel) */
    .workspace-body[data-tab="ask"] {
      background: #ffffff;
      padding: 0;

    .ask-inner-sidebar {

      padding: 0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;

    .ask-inner-sidebar.collapsed {

    .ask-panel-title {

      font-weight: 600;
      padding: 0 11px;
      border-radius: 8px;

      align-items: center;

    .ask-new-chat-pill svg {

      height: 15px;
      flex-shrink: 0;

    }

    .chat-history-item {
      padding: 9px 11px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 500;

    }

    .chat-history-item:hover {

    .chat-history-item.selected {
      background: #ffffff;
      font-weight: 600;
      color: var(--accent-ink);

    .chat-history-title {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-delete-btn {
      border: none;
      background: transparent;
      color: #7c7f90;
      font-size: 12px;
      width: 20px;
      height: 20px;
      border-radius: 5px;
      cursor: pointer;
      opacity: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.12s ease, background 0.12s ease;
    }

    .chat-history-item:hover .chat-delete-btn {
      opacity: 1;
    }

    .chat-delete-btn:hover {
      background: #dcdce4;
      color: #16161d;
    }

    .ask-main-pane {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: #ffffff;
      padding: 24px 36px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
    }

    .ask-minimal-stage {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto;
      padding: 32px 0;
    }

    .ask-minimal-heading {
      font-family: Georgia, Cambria, "Times New Roman", Times, serif;
      font-size: 27px;
      font-weight: 400;
      color: #1f1f24;
      letter-spacing: -0.015em;
      text-align: center;
      margin: 0 0 28px 0;
    }

    .ask-pill-bar {
      width: 100%;
      height: 54px;
      background: #ffffff;
      border: 1px solid #e7e7ee;
      border-radius: 999px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.06);
      display: flex;
      align-items: center;
      padding: 0 10px 0 18px;
      gap: 10px;
      transition: box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .ask-pill-bar:focus-within {
      border-color: #d0d0dc;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.09);
    }

    .ask-pill-plus {
      border: none;
      background: transparent;
      color: #6b6e7f;
      font-size: 20px;
      line-height: 1;
      padding: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .ask-pill-input {
      flex: 1;
      border: none;

      font-size: 14.5px;

    .ask-pill-input::placeholder {

    .ask-pill-send {

      align-items: center;
      justify-content: center;
      flex-shrink: 0;

    .ask-pill-send:hover {

    .ask-chips-row {
      display: flex;

    .ask-suggestion-chip {

      color: #3a3c4a;
      border-radius: 10px;

      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background 0.12s ease, border-color 0.12s ease;

    .ask-suggestion-chip:hover {
      background: #f7f7fa;
      border-color: #d4d4e0;
    }

    .ask-minimal-answer {
      width: 100%;
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 24px;
      background: var(--monogram-bg);
      color: #ffffff;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      display: none;
      z-index: 999;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    }
  </style>
</head>
<body>
  <!-- Single Collapsible Left Document Drawer -->
  <aside class="doc-drawer" id="docListPane">
    <div class="drawer-top">
      <div class="drawer-brand-row" style="height:28px;">
        <div class="tenant-switcher-wrap">
          <select class="tenant-select" id="tenantSelectDropdown" onchange="onTenantSwitched(this.value)" title="Select tenant workspace"></select>
        </div>
        <button type="button" class="icon-toggle-btn" title="Hide documents drawer" onclick="toggleDocListPane()">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
            <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
          </svg>
        </button>
      </div>

      <div class="workspace-mode-switcher" role="tablist" aria-label="Workspace mode">
        <button type="button" class="workspace-mode-btn active" id="btnModeDocuments" onclick="setWorkspaceMode('documents')">Documents</button>
        <button type="button" class="workspace-mode-btn" id="btnModeGraph" onclick="setWorkspaceMode('graph')">Graph</button>
        <button type="button" class="workspace-mode-btn" id="btnModeAsk" onclick="setWorkspaceMode('ask')">✦ Ask AI</button>
      </div>

      <div class="search-box" id="docSearchBoxWrap">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="8.5" cy="8.5" r="5.5" />
          <path d="M13 13l4 4" stroke-linecap="round" />
        </svg>
        <input type="text" id="docSearchInput" placeholder="Search name or content..." oninput="renderDocumentList()" />
      </div>
    </div>

    <div class="drawer-subbar">
      <span id="docListCountLabel">0 documents</span>
    </div>

    <div class="doc-items-scroll" id="docItemsList"></div>

    <div class="drawer-footer">
      <label class="btn-upload-primary" id="drawerUploadLabel" title="Upload a PDF document">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M10 13V4m0 0L6.5 7.5M10 4l3.5 3.5M4 15.5h12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="uploadBtnLabel">Upload PDF</span>
        <input type="file" id="docUploadInput" accept=".pdf" style="display:none" onchange="uploadAndRunTenantDocument(this)" />
      </label>
      <a href="/admin.html" id="adminStudioSwitchLink" class="admin-switch-link" title="Open Agent Harness Admin Studio" onclick="this.href='/admin.html?tenant=' + encodeURIComponent(currentTenant ? currentTenant.tenantId : '')">
        <span>Agent Harness Admin</span>
        <span>↗</span>
      </a>
      <button type="button" id="identitySignOut" class="admin-switch-link" onclick="DocIntelIdentity.signOut()" hidden>
        Sign out
      </button>
      <a href="/review.html" class="admin-switch-link" onclick="this.href='/review.html?tenant=' + encodeURIComponent(currentTenant ? currentTenant.tenantId : '')">
        Human review
      </a>
    </div>
  </aside>

  <!-- Main Workspace ("Project Meridian" Header + Floating White-Pill Tabs) -->
  <main class="workspace-main">
    <header class="meridian-header">
      <div class="meridian-top-row">
        <div class="meridian-identity">
          <button type="button" class="icon-toggle-btn" id="btnHeaderExpandDocList" style="display:none;align-self:center;" title="Show documents drawer" onclick="toggleDocListPane()">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" />
              <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" />
            </svg>
          </button>
          <h1 class="meridian-title" id="selectedDocTitle">Select or upload a document</h1>
          <span class="meridian-folder-meta" id="selectedDocFolderMeta">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 6a2 2 0 012-2h3.2l1.8 2h6a2 2 0 012 2v6.5a2 2 0 01-2 2h-11a2 2 0 01-2-2V6z" />
            </svg>
            <span id="selectedDocMetaText">—</span>
          </span>
        </div>

        <div class="meridian-actions">
          <div id="sliceSelectorRow" style="display:flex;align-items:center;gap:6px;"></div>
          <button type="button" class="ghost-action-btn" id="btnHeaderExportJson" onclick="exportSelectedJobJson()" title="Download extracted JSON">Export</button>
        </div>
      </div>

      <div class="meridian-nav-row" id="meridianNavRow">
        <nav class="meridian-tabs" id="insightsTabBar" aria-label="Document views">
          <button type="button" class="meridian-tab active" data-tab="insights" onclick="setDocResultTab('insights')">Insights</button>
          <button type="button" class="meridian-tab" data-tab="document" onclick="setDocResultTab('document')">View Document</button>
          <button type="button" class="meridian-tab" data-tab="entities" onclick="setDocResultTab('entities')">Entities</button>
          <button type="button" class="meridian-tab" data-tab="structured" onclick="setDocResultTab('structured')">Structured Data</button>
          <button type="button" class="meridian-tab" data-tab="metadata" onclick="setDocResultTab('metadata')">Metadata</button>
        </nav>
      </div>
    </header>

    <section class="workspace-body" id="docCenterBody" data-tab="insights"></section>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/identity.js"></script>
  <script src="/ask-ai.js"></script>
  <script src="/evidence.js"></script>
  <script>
    let tenants = [];
    let currentTenant = null;
    let tenantJobs = [];
    let selectedJobId = null;
    let selectedSliceIndex = -1; // -1 = All Slices
    let workspaceMode = 'documents'; // 'documents' | 'graph' (Cross-document tenant-level graph)
    let docResultTab = 'insights'; // 'insights' | 'document' | 'entities' | 'structured' | 'metadata' | 'prompt:<id>'
    let selectedEntityCategory = 'ALL';
    let selectedPromptFilterView = 'ALL'; // 'ALL' | 'MATCHED' | 'SKIPPED'
    let graphSelectedEntityNames = new Set(); // empty = All entity names
    let graphSelectedEntityValues = new Set(); // Set of 'EntityName||EntityValue' pairs (multi-select!)
    let graphSelectedEntityValuePair = 'ALL';
    let graphEntityDropdownOpen = false;
    let graphEntityDropdownSearch = '';
    let graphEntitySearchQuery = '';
    let graphFocusedNodeId = null;
    let graphHoveredNodeId = null;
    let graphDepthMode = 'GLOBAL'; // 'GLOBAL' | 'HOP1' | 'HOP2'
    let graphZoom = 1;
    let graphPanX = 0;
    let graphPanY = 0;
    let graphSimNodes = [];
    let graphSimEdges = [];
    let graphSimAnimFrame = null;
    let graphCustomNodePositions = {};
    let askAiQuestionInput = '';
    let askAiLoading = false;
    let askAiLoadingChatId = null;
    let askAiLoadingTenantId = null;
    let askAiProgressText = '';
    let tenantChats = [];
    let loadedChatStorageKey = null;
    let activeChatId = null;
    let askInnerSidebarCollapsed = false;
    let askChatSearchQuery = '';
    let jobPollTimer = null;

    function onAskChatSearchInput(val) {
      askChatSearchQuery = val || '';
      renderSelectedDocument();
      const inp = document.getElementById('askChatSearchInput');
      if (inp) {
        inp.focus();
        inp.setSelectionRange(inp.value.length, inp.value.length);
      }
    }

    function toggleAskInnerSidebar() {
      askInnerSidebarCollapsed = !askInnerSidebarCollapsed;
      const el = document.getElementById('askInnerSidebar');
      const expandBtn = document.getElementById('btnExpandAskSidebar');
      if (el) el.classList.toggle('collapsed', askInnerSidebarCollapsed);
      if (expandBtn) expandBtn.style.display = askInnerSidebarCollapsed ? 'inline-flex' : 'none';
    }

    function getChatsStorageKey(tenantId = currentTenant?.tenantId || 'default',
      partition = globalThis.DocIntelIdentity?.chatPartition) {
      if (!partition) throw new Error('A verified chat identity is required.');
      return `docintel_chats_v2_${partition}_${tenantId}`;
    }

    function loadTenantChats(forceReload = false) {
      const storageKey = getChatsStorageKey();
      if (loadedChatStorageKey !== storageKey) {
        tenantChats = [];
        activeChatId = null;
      }
      loadedChatStorageKey = storageKey;
      if (!forceReload && Array.isArray(tenantChats) && tenantChats.length > 0) {
        if (!activeChatId || !tenantChats.some(c => c.id === activeChatId)) {
          activeChatId = tenantChats[0].id;
        }
        return;
      }
      try {
        const raw = localStorage.getItem(storageKey);
        tenantChats = raw ? JSON.parse(raw) : [];
      } catch {
        console.error('Unable to read browser chat history.');
        showToast('Chat history could not be loaded on this device.');
        tenantChats = [];
      }
      if (!Array.isArray(tenantChats)) tenantChats = [];
      if (tenantChats.length === 0) {
        const initialChat = {
          id: 'chat-' + Date.now(),
          title: 'New chat',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          messages: []
        };
        tenantChats.push(initialChat);
        activeChatId = initialChat.id;
        saveTenantChats();
      } else if (!activeChatId || !tenantChats.some(c => c.id === activeChatId)) {
        activeChatId = tenantChats[0].id;
      }
    }

    function saveTenantChats() {
      try {
        localStorage.setItem(getChatsStorageKey(), JSON.stringify(tenantChats));
      } catch {
        console.error('Unable to save browser chat history.');
        showToast('Chat history could not be saved. Keep this tab open while your question is processing.');
      }
    }

    function getActiveChat() {
      if (!activeChatId || !tenantChats.some(c => c.id === activeChatId)) {
        loadTenantChats();
      }
      return tenantChats.find(c => c.id === activeChatId) || tenantChats[0];
    }

    function startNewAskAiChat() {
      loadTenantChats();
      // Reuse existing empty chat if the top chat has 0 messages
      const existingEmpty = tenantChats.find(c => (c.messages || []).length === 0);
      if (existingEmpty) {
        activeChatId = existingEmpty.id;
      } else {
        const newChat = {
          id: 'chat-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          title: 'New chat',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          messages: []
        };
        tenantChats.unshift(newChat);
        activeChatId = newChat.id;
        saveTenantChats();
      }
      askAiQuestionInput = '';
      renderDocumentList();
      renderSelectedDocument();
      const inp = document.getElementById('askAiMainInputEl');
      if (inp) inp.focus();
    }

    function startNewAskAiChatAndOpen() {
      workspaceMode = 'ask';
      startNewAskAiChat();

        setWorkspaceMode('ask');

      renderDocumentList();
      renderSelectedDocument();

    function deleteAskAiChat(chatId, evt) {
      if (evt) evt.stopPropagation();
      tenantChats = tenantChats.filter(c => c.id !== chatId);
      if (tenantChats.length === 0) {
        const fresh = {
          id: 'chat-' + Date.now(),
          title: 'New chat',
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          messages: []
        };
        tenantChats.push(fresh);
        activeChatId = fresh.id;
      } else if (activeChatId === chatId) {
        activeChatId = tenantChats[0].id;
      }
      saveTenantChats();
      renderDocumentList();
      renderSelectedDocument();

    function isGraphCapabilityEnabled() {
      return currentTenant?.capabilities?.DocumentGraph?.enabled !== false;
    }

    function isAskAiCapabilityEnabled() {
      return currentTenant?.capabilities?.AskAi?.enabled !== false;
    }

    function syncTenantWorkspaceCapabilities() {
      const graphOn = isGraphCapabilityEnabled();
      const askOn = isAskAiCapabilityEnabled();
      const switcher = document.querySelector('#docListPane .workspace-mode-switcher');
      const btnDocs = document.getElementById('btnModeDocuments');
      const btnGraph = document.getElementById('btnModeGraph');
      const btnAsk = document.getElementById('btnModeAsk');

      if (btnGraph) btnGraph.style.display = graphOn ? 'inline-flex' : 'none';
      if (btnAsk) btnAsk.style.display = askOn ? 'inline-flex' : 'none';

      const visibleCount = 1 + (graphOn ? 1 : 0) + (askOn ? 1 : 0);
      if (switcher) {
        switcher.style.display = visibleCount > 1 ? 'grid' : 'none';
        switcher.style.gridTemplateColumns = `repeat(${visibleCount}, 1fr)`;
      }

      if ((workspaceMode === 'graph' && !graphOn) || (workspaceMode === 'ask' && !askOn)) {
        workspaceMode = 'documents';
      }

      if (btnDocs) btnDocs.classList.toggle('active', workspaceMode === 'documents');
      if (btnGraph) btnGraph.classList.toggle('active', workspaceMode === 'graph');
      if (btnAsk) btnAsk.classList.toggle('active', workspaceMode === 'ask');
    }

    function setWorkspaceMode(mode) {
      if (mode === 'graph' && !isGraphCapabilityEnabled()) mode = 'documents';
      if (mode === 'ask' && !isAskAiCapabilityEnabled()) mode = 'documents';
      workspaceMode = mode;
      syncTenantWorkspaceCapabilities();

      if (mode === 'ask') {
        loadTenantChats();
        const chat = getActiveChat();
        if (!askAiLoading && chat?.pendingAskAi?.runId) {
          runCrossDocumentAskAi(null, true);
        }
      }
      renderDocumentList();
      renderSelectedDocument();
    }

    function getMonogram(name) {
      return String(name || 'DI')
        .split(/[\s&-]+/)
        .filter(Boolean)
        .map(w => w[0])
        .join('')
        .substring(0, 2)
        .toUpperCase() || 'DI';
    }

    function cleanInsightText(raw) {
      if (!raw) return '';
      return String(raw)
        .replace(/^\[[^\]]*Insight\]\s*/i, '')
        .replace(/\s*\(Guided by:[^)]*\)\s*$/i, '')
        .trim();
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function escapeJsArg(value) {
      return escapeHtml(JSON.stringify(String(value ?? '')));
    }

    function formatModelScore(value, scale) {
      const info = DocIntelEvidence.describe(value, scale);
      return info.modelPercent === null ? 'Unknown model score' : `Model score ${info.modelPercent}%`;
    }

    function renderValueProvenance(value, job, scale) {
      const info = DocIntelEvidence.describe(value, scale);
      const source = job?.tenantId && job?.jobId
        ? `/api/harness/tenants/${encodeURIComponent(job.tenantId)}/jobs/${encodeURIComponent(job.jobId)}/original`
        : null;
      const links = source ? info.pages.map(page =>
        `<a class="text-link-btn" href="${escapeHtml(source)}#page=${page}" target="_blank" rel="noopener noreferrer">Original p.${page}</a>`
      ).join(' ') : '';
      return `<div style="font-size:11px;color:var(--text-muted);" title="${escapeHtml(info.tooltip)}">${escapeHtml(info.status)}${links ? ' · ' + links : ''}</div>`;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2200);

      const resp = await fetch('/api/harness/tenants');
      tenants = await resp.json();
      const urlTenant = new URLSearchParams(window.location.search).get('tenant');
      currentTenant = tenants.find(t => t.tenantId === urlTenant) || tenants[0] || null;

      currentTenant = tenants.find(t => t.tenantId === tenantId) || tenants[0] || null;

      selectedSliceIndex = -1;

    async function loadTenantJobs(preferredJobId) {
      if (!currentTenant) return;
      const resp = await fetch(`/api/harness/tenants/${encodeURIComponent(currentTenant.tenantId)}/jobs`);
      if (!resp.ok) return;
      tenantJobs = await resp.json();

      if (preferredJobId) {
        selectedJobId = preferredJobId;
      } else if (!selectedJobId || !tenantJobs.some(j => j.jobId === selectedJobId)) {
        selectedJobId = tenantJobs.length > 0 ? tenantJobs[0].jobId : null;
        selectedSliceIndex = -1;
      }

      renderDocumentList();
      renderSelectedDocument();
      scheduleJobPollingIfNeeded();

    function scheduleJobPollingIfNeeded() {
      if (jobPollTimer) {
        clearTimeout(jobPollTimer);
        jobPollTimer = null;
      }
      if (tenantJobs.some(j => j.status === 'Queued' || j.status === 'Running')) {
        jobPollTimer = setTimeout(() => loadTenantJobs(selectedJobId), 2000);
      }
    }

    function buildJobSearchCorpus(job) {
      const segs = job.segments || [];
      const markdownAndContent = segs.map(s => [
        s.identifiedDocumentName || '',
        s.documentTypeName || '',
        s.markdown || '',
        s.bodyText || '',
        s.translatedText || '',
        s.insightSummary || '',
        (s.footers || []).join(' ')
      ].join('\n')).join('\n');

      const entitiesText = (job.extractedEntities || [])
        .map(e => `${e.name || ''} ${e.value || ''}`)
        .join(' ');

      return `${job.fileName || ''}\n${job.jobId || ''}\n${job.packetSummary || ''}\n${entitiesText}\n${markdownAndContent}`;
    }

    function extractContentMatchSnippet(job, rawQuery) {
      if (!rawQuery) return '';
      const q = rawQuery.toLowerCase();
      if ((job.fileName || '').toLowerCase().includes(q)) return '';

      for (const s of (job.segments || [])) {
        const md = String(s.markdown || s.bodyText || s.translatedText || '')
          .replace(/<!--[\s\S]*?-->/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        const idx = md.toLowerCase().indexOf(q);
        if (idx >= 0) {
          const start = Math.max(0, idx - 22);
          const end = Math.min(md.length, idx + rawQuery.length + 34);
          const prefix = start > 0 ? '…' : '';
          const suffix = end < md.length ? '…' : '';
          return `p.${s.startPage}: "${prefix}${md.slice(start, end)}${suffix}"`;
        }
      }
      return '';
    }

    function renderDocumentList() {
      const container = document.getElementById('docItemsList');
      const rawQuery = (document.getElementById('docSearchInput').value || '').trim();
      const query = rawQuery.toLowerCase();

      const filtered = tenantJobs.filter(j => {
        if (!query) return true;
        const hay = buildJobSearchCorpus(j).toLowerCase();
        return hay.includes(query);
      });

      document.getElementById('docListCountLabel').textContent = `${filtered.length} document${filtered.length === 1 ? '' : 's'}`;
      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="padding:28px 12px;text-align:center;color:var(--text-secondary);font-size:12.5px;line-height:1.5;">
            No documents found.<br/>Upload a PDF below to get started.
          </div>
        `;
        return;
      }

      filtered.forEach(job => {
        const isSelected = job.jobId === selectedJobId;
        const dt = job.createdAtUtc ? new Date(job.createdAtUtc) : new Date();
        const dateStr = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        const segs = job.segments || [];
        const dotCls = job.status === 'Completed' ? '' : (job.status === 'Failed' ? 'failed' : 'running');
        const snippet = extractContentMatchSnippet(job, rawQuery);

        const row = document.createElement('div');
        row.className = 'doc-row' + (isSelected ? ' selected' : '');
        row.title = `${job.fileName} (${job.status})`;
        row.onclick = () => {
          selectedJobId = job.jobId;
          selectedSliceIndex = -1;
          if (workspaceMode !== 'documents') {
            setWorkspaceMode('documents');
            return;
          }
          renderDocumentList();
          renderSelectedDocument();
        };

        row.innerHTML = `
          <div class="doc-row-main">
            <div class="doc-row-name">${escapeHtml(job.fileName)}</div>
            <div class="doc-row-meta">${escapeHtml(dateStr)} · ${job.totalPages || 0} pp${segs.length > 1 ? ` · ${segs.length} slices` : ''}</div>
            ${snippet ? `<div style="font-size:11px;color:var(--accent-ink);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(snippet)}</div>` : ''}
          </div>
          <span class="status-dot ${dotCls}" title="${escapeHtml(job.status)}"></span>
        `;
        container.appendChild(row);
      });
    }

    async function uploadAndRunTenantDocument(inputEl) {
      if (!currentTenant || !inputEl.files || !inputEl.files[0]) return;
      const file = inputEl.files[0];
      const lbl = document.getElementById('uploadBtnLabel');
      lbl.textContent = 'Uploading...';

      try {
        const fd = new FormData();
        fd.append('file', file);
        const resp = await fetch(`/api/harness/tenants/${encodeURIComponent(currentTenant.tenantId)}/jobs`, {
          method: 'POST',
          body: fd
        });
        if (resp.ok) {
          const accepted = await resp.json();
          showToast(`Submitted ${file.name}`);
          await loadTenantJobs(accepted.jobId);
        } else {
          showToast('Upload failed');
        }
      } finally {
        lbl.textContent = 'Upload PDF';
        inputEl.value = '';
      }
    }

    async function reevaluateSelectedJobPrompts() {
      const job = tenantJobs.find(j => j.jobId === selectedJobId);
      if (!job || !currentTenant) return;
      showToast('Evaluating Prompt Columns on PDF/Base64...');
      const resp = await fetch(`/api/harness/tenants/${encodeURIComponent(currentTenant.tenantId)}/jobs/${encodeURIComponent(job.jobId)}/evaluate-prompts`, {
        method: 'POST'
      });
